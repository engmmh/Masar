<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>مسار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #F1F4F2;
  --surface: #FFFFFF;
  --surface2: #E6ECE9;
  --text: #14231F;
  --muted: #56675F;
  --line: #D3DDD9;
  --teal: #0F5C5A;
  --teal-ink: #FFFFFF;
  --amber: #B86E0B;
  --amber-bg: #FBEBCF;
  --done: #2A7D4B;
  --done-bg: #DDF0E4;
  --miss: #B5443B;
  --miss-bg: #F8E1DE;
  --display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B1514; --surface: #132220; --surface2: #1B2E2B; --text: #E6F0ED; --muted: #9CB0AA; --line: #263A36;
    --teal: #4CC2B8; --teal-ink: #06201E; --amber: #F0B34A; --amber-bg: #3A2C10;
    --done: #6FD09A; --done-bg: #16362A; --miss: #FF8E82; --miss-bg: #3A1E1B;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B1514; --surface: #132220; --surface2: #1B2E2B; --text: #E6F0ED; --muted: #9CB0AA; --line: #263A36;
  --teal: #4CC2B8; --teal-ink: #06201E; --amber: #F0B34A; --amber-bg: #3A2C10;
  --done: #6FD09A; --done-bg: #16362A; --miss: #FF8E82; --miss-bg: #3A1E1B;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.6; padding-inline: 16px; }
#app { max-width: 640px; margin-inline: auto; padding-block: 14px 110px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.en { direction: ltr; unicode-bidi: isolate; display: inline-block; font-weight: 500; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.muted { color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

/* top */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-block: 6px 12px; }
.top h1 { font-size: 26px; }
.top .dates { font-size: 14px; color: var(--muted); }
.chip { display: inline-flex; gap: 6px; align-items: center; background: var(--surface2); border-radius: 99px; padding: 2px 12px; font-size: 14px; white-space: nowrap; }
.banner { background: var(--amber-bg); color: var(--text); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-block-end: 12px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-block-end: 12px; }
.card h2 { font-size: 20px; margin-block-end: 8px; }
.card h3 { font-size: 17px; margin-block-end: 6px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.wrapr { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* hero */
.hero { display: flex; gap: 16px; align-items: center; }
.ringbox { position: relative; width: 132px; height: 132px; flex: none; }
.ring { width: 100%; height: 100%; }
.seg { stroke: var(--surface2); }
.seg.done { stroke: var(--done); }
.seg.late { stroke: var(--amber); }
.seg.current { stroke: var(--teal); }
.seg.missed { stroke: var(--miss); }
.ringtxt { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ringtxt b { font-family: var(--display); font-size: 34px; font-weight: 700; }
.ringtxt span { font-size: 12px; color: var(--muted); }
.next .lbl { font-size: 13px; color: var(--muted); }
.next .nm { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.15; }
.next .cd { font-size: 20px; font-weight: 600; color: var(--teal); }
.next .sub { font-size: 14px; color: var(--muted); }
.streak { display: inline-flex; gap: 6px; align-items: center; margin-block-start: 8px; color: var(--amber); font-weight: 600; font-size: 15px; }
.streak svg { width: 18px; height: 18px; }

/* alerts */
.alert { background: var(--miss-bg); border: 1px solid var(--miss); }
.alert h2 { color: var(--miss); font-size: 18px; }
.miss-list { display: grid; gap: 6px; margin-block-start: 8px; }
.miss-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--surface); border-radius: 10px; padding: 6px 12px; font-size: 15px; }

/* prayers */
.prow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-block-end: 8px; }
.prow .pn { font-family: var(--display); font-size: 20px; font-weight: 600; }
.prow .pt { font-size: 15px; color: var(--muted); }
.prow .pbtn { grid-row: 1 / span 2; grid-column: 2; min-width: 116px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); font-weight: 600; padding: 0 14px; }
.prow.st-current { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal) inset; }
.prow.st-current .pbtn { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }
.prow.st-done .pbtn { background: var(--done-bg); color: var(--done); border-color: var(--done); }
.prow.st-late .pbtn, .prow.st-qada .pbtn { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
.prow.st-missed { border-color: var(--miss); }
.prow.st-missed .pbtn { background: var(--miss-bg); color: var(--miss); border-color: var(--miss); }
.prow.st-upcoming .pbtn { color: var(--muted); cursor: default; }
.prow.st-upcoming { opacity: .85; }

/* generic buttons */
.btn { min-height: 44px; border-radius: 12px; border: 1px solid var(--teal); background: var(--teal); color: var(--teal-ink); font-weight: 600; padding: 0 18px; }
.btn.alt { background: var(--surface2); color: var(--text); border-color: var(--line); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: .5; cursor: default; }
.bar { height: 10px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--teal); border-radius: 99px; }
.bar.amber > i { background: var(--amber); }

/* tabs */
.tabs { position: fixed; inset-inline: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs ul { max-width: 640px; margin: 0 auto; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tabs button { width: 100%; background: none; border: 0; display: grid; place-items: center; gap: 2px; padding: 6px 0; border-radius: 12px; font-size: 13px; color: var(--muted); }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--teal); background: var(--surface2); font-weight: 600; }

/* archive */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-block-end: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.stat b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.2; }
.stat span { font-size: 13px; color: var(--muted); }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 4px 3px; text-align: center; border-block-end: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
td.day { text-align: start; padding-inline-start: 10px; white-space: nowrap; font-size: 14px; }
tr.today td.day { color: var(--teal); font-weight: 600; }
tr:last-child td { border-block-end: 0; }
.dot { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--muted); font-size: 14px; display: inline-grid; place-items: center; padding: 0; }
.dot.done { background: var(--done-bg); color: var(--done); border-color: var(--done); }
.dot.late, .dot.qada { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
.dot.missed { background: var(--miss-bg); color: var(--miss); border-color: var(--miss); }
.dot.upcoming, .dot.future, .dot.na { opacity: .5; cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-block: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-inline-end: 4px; vertical-align: -1px; }

/* quran */
.seg2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg2 button { min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); }
.seg2 button[aria-pressed="true"] { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 600; }
.field { display: grid; gap: 4px; margin-block: 10px; font-size: 14px; color: var(--muted); }
.field input, .field select, .inp { font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 44px; width: 100%; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper b { min-width: 2.5ch; text-align: center; font-family: var(--display); font-size: 24px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 120px; margin-block-start: 8px; }
.week div { display: grid; grid-template-rows: 1fr auto auto; gap: 2px; height: 100%; text-align: center; font-size: 12px; color: var(--muted); }
.week .col { display: flex; align-items: flex-end; }
.week .col i { display: block; width: 100%; background: var(--teal); border-radius: 6px 6px 2px 2px; min-height: 3px; }
.week .col i.full { background: var(--done); }

/* learn */
.units { display: grid; gap: 8px; }
.unit { display: flex; gap: 12px; align-items: center; text-align: start; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.unit .no { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; font-family: var(--display); font-weight: 700; }
.unit.done .no { background: var(--done); color: var(--teal-ink); }
.pts { display: grid; gap: 8px; margin-block: 8px 14px; padding: 0; list-style: none; }
.pts li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.opts { display: grid; gap: 8px; margin-block: 12px; }
.opt { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; text-align: start; direction: ltr; font-weight: 500; }
.opt.ok { background: var(--done-bg); border-color: var(--done); color: var(--done); }
.opt.bad { background: var(--miss-bg); border-color: var(--miss); color: var(--miss); }
.qtext { font-size: 20px; font-family: var(--display); direction: ltr; text-align: start; unicode-bidi: plaintext; }
.qtext.ar { direction: rtl; }
.fb { border-radius: 12px; padding: 10px 14px; margin-block: 8px; font-size: 15px; }
.fb.ok { background: var(--done-bg); color: var(--done); }
.fb.bad { background: var(--miss-bg); color: var(--miss); }
.flash { min-height: 170px; display: grid; place-content: center; text-align: center; gap: 6px; cursor: pointer; }
.flash .w { font-family: var(--display); font-size: 34px; direction: ltr; }
.crumb { font-size: 14px; color: var(--muted); margin-block-end: 8px; }
.linkbtn { background: none; border: 0; color: var(--teal); padding: 4px 0; font-size: 15px; }

#toast { position: fixed; inset-inline: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 420px; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <div id="view"></div>
</div>
<nav class="tabs" dir="rtl" aria-label="الأقسام">
  <ul>
    <li><button data-act="tab" data-t="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>اليوم</button></li>
    <li><button data-act="tab" data-t="archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>الأرشيف</button></li>
    <li><button data-act="tab" data-t="quran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21a2 2 0 0 1 2-2h13v2H6"/></svg>القرآن</button></li>
    <li><button data-act="tab" data-t="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/></svg>تعلّم</button></li>
  </ul>
</nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ---------------- constants ---------------- */
  var LAT = 24.7136, LNG = 46.6753, TZ = 3;
  var PRAYERS = [
    { k: "fajr", n: "الفجر" }, { k: "dhuhr", n: "الظهر" }, { k: "asr", n: "العصر" },
    { k: "maghrib", n: "المغرب" }, { k: "isha", n: "العشاء" }
  ];
  var WD = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  var WD_S = ["أحد", "اثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة", "سبت"];
  var UNITS = { page: { n: "صفحات", f: 1 }, half: { n: "نصف جزء", f: 10 }, juz: { n: "أجزاء", f: 20 } };

  /* ---------------- helpers ---------------- */
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmtEn(s) { return esc(s).replace(/\{([^}]+)\}/g, '<span class="en">$1</span>'); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function keyOf(d) { return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()); }
  function addDays(key, n) { var p = key.split("-").map(Number); return keyOf(new Date(Date.UTC(p[0], p[1] - 1, p[2] + n))); }
  function nowR() {
    var ms = Date.now(), d = new Date(ms + TZ * 3600e3);
    return { ms: ms, key: keyOf(d), dow: d.getUTCDay(), h: d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600 };
  }
  function dowOf(key) { var p = key.split("-").map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); }
  function fmtTime(h) {
    var m = Math.round(h * 60), hh = Math.floor(m / 60) % 24, mm = m % 60;
    return '<span class="num">' + (hh % 12 || 12) + ":" + pad(mm) + "</span> " + (hh >= 12 ? "م" : "ص");
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return pad(h) + ":" + pad(m) + ":" + pad(s);
  }
  function ico(name) {
    var s = {
      flame: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5 4 5 4 9a4 4 0 0 1-8 0c0-1.5.6-2.6 1.4-3.5C9.6 9 10 10 11 10c0-3-1-5 1-8zM12 22a7 7 0 0 0 7-7c0-2-.8-3.6-1.8-5 0 3.5-2.4 5.5-5.2 5.5S6.8 13 6.8 10.5C5.6 12 5 13.4 5 15a7 7 0 0 0 7 7z"/></svg>'
    };
    return s[name] || "";
  }

  /* ---------------- prayer times (Umm al-Qura, Riyadh) ---------------- */
  var rad = Math.PI / 180, deg = 180 / Math.PI;
  function sin(d) { return Math.sin(d * rad); } function cos(d) { return Math.cos(d * rad); } function tan(d) { return Math.tan(d * rad); }
  function asin(x) { return deg * Math.asin(x); } function acos(x) { return deg * Math.acos(x); }
  function atan2(y, x) { return deg * Math.atan2(y, x); } function arccot(x) { return deg * Math.atan(1 / x); }
  function fixA(a) { return a - 360 * Math.floor(a / 360); } function fixH(a) { return a - 24 * Math.floor(a / 24); }
  function julian(y, m, d) { if (m <= 2) { y -= 1; m += 12; } var A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4); return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5; }
  function sunPos(jd) {
    var D = jd - 2451545.0, g = fixA(357.529 + 0.98560028 * D), q = fixA(280.459 + 0.98564736 * D);
    var L = fixA(q + 1.915 * sin(g) + 0.020 * sin(2 * g)), e = 23.439 - 0.00000036 * D;
    var RA = fixH(atan2(cos(e) * sin(L), cos(L)) / 15);
    return { decl: asin(sin(e) * sin(L)), eq: q / 15 - RA };
  }
  function midDay(jd, t) { return fixH(12 - sunPos(jd + t).eq); }
  function angleTime(jd, ang, t, ccw) {
    var decl = sunPos(jd + t).decl, noon = midDay(jd, t);
    var x = (-sin(ang) - sin(decl) * sin(LAT)) / (cos(decl) * cos(LAT));
    return noon + (ccw ? -1 : 1) * acos(x) / 15;
  }
  function asrTime(jd, f, t) {
    var decl = sunPos(jd + t).decl;
    return angleTime(jd, -arccot(f + tan(Math.abs(LAT - decl))), t, false);
  }
  function isRamadan(y, m, d) {
    try { return new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { month: "numeric", timeZone: "UTC" }).format(new Date(Date.UTC(y, m - 1, d, 12))) === "9"; }
    catch (e) { return false; }
  }
  var schedCache = {};
  function sched(key) {
    if (schedCache[key]) return schedCache[key];
    var p = key.split("-").map(Number), jd = julian(p[0], p[1], p[2]) - LNG / (15 * 24);
    var t = { fajr: 5 / 24, sunrise: 6 / 24, dhuhr: 12 / 24, asr: 13 / 24, sunset: 18 / 24 }, r, k;
    for (var i = 0; i < 2; i++) {
      r = { fajr: angleTime(jd, 18.5, t.fajr, true), sunrise: angleTime(jd, 0.833, t.sunrise, true), dhuhr: midDay(jd, t.dhuhr), asr: asrTime(jd, 1, t.asr), sunset: angleTime(jd, 0.833, t.sunset, false) };
      t = {}; for (k in r) t[k] = r[k] / 24;
    }
    var adj = TZ - LNG / 15; for (k in r) r[k] += adj;
    var isha = r.sunset + (isRamadan(p[0], p[1], p[2]) ? 120 : 90) / 60;
    var out = { times: [r.fajr, r.dhuhr, r.asr, r.sunset, isha], sunrise: r.sunrise };
    schedCache[key] = out; return out;
  }
  function windowOf(key, i) {
    var s = sched(key), start = s.times[i], end;
    if (i === 0) end = s.sunrise; else if (i === 1) end = s.times[2]; else if (i === 2) end = s.times[3];
    else if (i === 3) end = s.times[4]; else end = 24 + sched(addDays(key, 1)).times[0];
    return { start: start, end: end };
  }
  function pname(key, i) { return (i === 1 && dowOf(key) === 5) ? "الجمعة" : PRAYERS[i].n; }
  function hijri(key) {
    try {
      var p = key.split("-").map(Number);
      return new Intl.DateTimeFormat("ar-u-nu-latn-ca-islamic-umalqura", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }).format(new Date(Date.UTC(p[0], p[1] - 1, p[2], 12)));

  function startQuiz(qs, title, unitId) {

    state.lv = { mode: "quiz" }; render();

  /* ---------------- events ---------------- */
  document.addEventListener("click", function (e) {

      case "tp": togglePrayer(el.getAttribute("data-d"), Number(el.getAttribute("data-p"))); break;
      case "more": state.archiveN += 30; render(); break;
      case "pg": addPages(Number(el.getAttribute("data-n"))); break;
      case "pgdone": setPages(Math.max(pagesOn(now.key), target())); toast("تقبّل الله ورد اليوم"); break;

      case "lhome": state.lv = { mode: "home" }; state.quiz = null; state.card = null; render(); break;
      case "unit-open": state.lv = { mode: "unit", u: el.getAttribute("data-u") }; window.scrollTo(0, 0); render(); break;
      case "quiz": var u = COURSE.units.filter(function (x) { return x.id === el.getAttribute("data-u"); })[0]; startQuiz(u.qs, u.title, u.id); break;
      case "mrev": startQuiz(mistakeIds().map(function (id) { return QINDEX[id]; }), "مراجعة الأخطاء", null); break;
      case "pick": answerMcq(el.getAttribute("data-k")); break;
      case "submit": answerFill(); break;
      case "qnext": state.quiz.i++; state.quiz.ans = null; if (state.quiz.i >= state.quiz.qs.length) finishQuiz(); render(); break;
      case "cards": state.card = { q: shuffle(dueCards(now)).slice(0, 15), i: 0, flip: false, known: 0 }; state.lv = { mode: "cards" }; render(); break;
      case "flip": if (state.card) { state.card.flip = true; render(); } break;
      case "know": knowCard(el.getAttribute("data-v") === "1"); break;
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "ans") { e.preventDefault(); answerFill(); }
    if ((e.key === "Enter" || e.key === " ") && e.target && e.target.getAttribute && e.target.getAttribute("data-act") === "flip") { e.preventDefault(); if (state.card) { state.card.flip = true; render(); } }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "startdate" && t.value) { state.settings.startDate = t.value; saveMeta("settings"); render(); toast("تم تحديث بداية التتبع"); }
    if (t.id === "startpage") { var n = Math.max(1, Math.min(604, parseInt(t.value, 10) || 1)); state.settings.startPage = n; saveMeta("settings", 300); render(); }
  });

  function answerMcq(k) {
    var z = state.quiz, q = z.qs[z.i]; if (z.ans) return;
    var sel = q.o[Number(k)], ok = sel === q.a;
    z.ans = { sel: sel, ok: ok }; if (ok) { z.ok++; z.right.push(q.id); } else z.wrong.push(q.id);
    render();
  }
  function answerFill() {
    var z = state.quiz, q = z.qs[z.i], inp = $("#ans"); if (z.ans || !inp) return;
    var v = inp.value; if (!norm(v)) return;
    var ok = q.a.map(norm).indexOf(norm(v)) !== -1;
    z.ans = { sel: v, ok: ok }; if (ok) { z.ok++; z.right.push(q.id); } else z.wrong.push(q.id);
    render();
  }
  function knowCard(yes) {
    var c = state.card, w = c.q[c.i], now = nowR(), cur = state.learn.cards[w.id] || { box: 0 };
    if (yes) { cur.box = Math.min(3, cur.box + 1); cur.due = addDays(now.key, INTERVALS[cur.box]); c.known++; addXp(3, now); }
    else { cur.box = 0; cur.due = now.key; }
    state.learn.cards[w.id] = cur;
    c.i++; c.flip = false;
    saveMeta("learn", c.i >= c.q.length ? 0 : 1500);
    render();
  }

  /* ---------------- boot ---------------- */
  render();
  setInterval(tick, 1000);
  initStore();
})();
</script>
