<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>مسار</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مسار">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #F2FAF5;
  --surface: #FFFFFF;
  --surface2: #E3F3EA;
  --text: #0B2B22;
  --muted: #5E7B70;
  --line: #CFE8DA;
  --teal: #0DA66B;
  --teal-deep: #087A4F;
  --teal-ink: #FFFFFF;
  --amber: #F59E0B;
  --amber-deep: #C67D04;
  --amber-bg: #FFF2D6;
  --blue: #3B6FED;
  --blue-deep: #2851B8;
  --blue-bg: #E8EFFF;
  --done: #22B35E;
  --done-deep: #178A45;
  --done-bg: #DEF7E6;
  --miss: #F0415B;
  --miss-deep: #C22B43;
  --miss-bg: #FDE3E8;
  --display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #081512; --surface: #0F221C; --surface2: #16302A; --text: #E9F7F0; --muted: #8FB3A5; --line: #1E3C34;
    --teal: #35E2A0; --teal-deep: #159C6C; --teal-ink: #04231A;
    --amber: #FFC24A; --amber-deep: #C78A1E; --amber-bg: #3A2A0E;
    --done: #4FE08A; --done-deep: #269A5F; --done-bg: #123828;
    --miss: #FF6B82; --miss-deep: #C73851; --miss-bg: #3A1620; --blue: #7EA2FF; --blue-deep: #4A6FD1; --blue-bg: #16233D;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #081512; --surface: #0F221C; --surface2: #16302A; --text: #E9F7F0; --muted: #8FB3A5; --line: #1E3C34;
  --teal: #35E2A0; --teal-deep: #159C6C; --teal-ink: #04231A;
  --amber: #FFC24A; --amber-deep: #C78A1E; --amber-bg: #3A2A0E;
  --done: #4FE08A; --done-deep: #269A5F; --done-bg: #123828;
  --miss: #FF6B82; --miss-deep: #C73851; --miss-bg: #3A1620; --blue: #7EA2FF; --blue-deep: #4A6FD1; --blue-bg: #16233D;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.6; overflow: hidden; }
#shell { position: fixed; inset: 0; max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; background: var(--bg); }
#top { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px; }
#top h1 { font-size: 27px; letter-spacing: .01em; }
#top .dates { font-size: 13px; color: var(--muted); line-height: 1.4; }
#top .chip { border: 0; color: var(--text); min-height: 34px; cursor: pointer; }
#pager { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
#pager::-webkit-scrollbar { display: none; }
.panel { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; overscroll-behavior-y: contain; padding: 4px 16px 28px; -webkit-overflow-scrolling: touch; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, background-color .15s ease; }
button svg { width: 20px; height: 20px; flex: none; }
.en { direction: ltr; unicode-bidi: isolate; display: inline-block; font-weight: 500; overflow-wrap: anywhere; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.muted { color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { button, .bar > i, .pnode { transition: none !important; } }

/* top */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-block: 6px 12px; }
.top h1 { font-size: 27px; letter-spacing: -.01em; }
.top .dates { font-size: 13.5px; color: var(--muted); font-weight: 500; line-height: 1.5; text-align: end; }
.chip { display: inline-flex; gap: 6px; align-items: center; background: var(--surface2); border-radius: 99px; padding: 2px 12px; font-size: 14px; white-space: nowrap; }
.banner { background: var(--amber-bg); color: var(--text); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-block-end: 12px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-block-end: 12px; box-shadow: 0 1px 2px color-mix(in srgb, var(--text) 4%, transparent), 0 10px 20px -16px color-mix(in srgb, var(--text) 18%, transparent); }
.card h2 { font-size: 20px; margin-block-end: 8px; letter-spacing: -.01em; }
.card h3 { font-size: 17px; margin-block-end: 6px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.wrapr { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* hero */
.card:has(.ringbox) { background: linear-gradient(160deg, var(--teal), var(--teal-deep)); border-color: transparent; color: var(--teal-ink); box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--teal) 55%, transparent); }
.hero { display: flex; gap: 16px; align-items: center; }
.ringbox { position: relative; width: 132px; height: 132px; flex: none; }
.ring { width: 100%; height: 100%; }
.seg { stroke: color-mix(in srgb, var(--teal-ink) 22%, transparent); }
.seg.done { stroke: var(--teal-ink); }
.seg.late { stroke: var(--amber); }
.seg.current { stroke: var(--teal-ink); opacity: .75; }
.seg.missed { stroke: var(--miss); }
.ringtxt { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; color: var(--teal-ink); }
.ringtxt b { font-family: var(--display); font-size: 34px; font-weight: 700; }
.ringtxt span { font-size: 12px; opacity: .8; }
.next .lbl { font-size: 13px; opacity: .8; }
.next .nm { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.15; }
.next .cd { font-size: 20px; font-weight: 700; }
.next .sub { font-size: 14px; opacity: .85; }
.streak { display: inline-flex; gap: 6px; align-items: center; margin-block-start: 8px; color: var(--amber); font-weight: 700; font-size: 15px; }
.streak svg { width: 18px; height: 18px; }

/* alerts */
.alert { background: var(--miss-bg); border: 1px solid var(--miss); }
.alert h2 { color: var(--miss); font-size: 18px; }
.miss-list { display: grid; gap: 6px; margin-block-start: 8px; }
.miss-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--surface); border-radius: 10px; padding: 6px 12px; font-size: 15px; }

/* prayers */
.prow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-block-end: 8px; }
.prow .pn { font-family: var(--display); font-size: 20px; font-weight: 600; }
.prow .pt { font-size: 15px; color: var(--muted); }
.prow .pbtn { grid-row: 1 / span 2; grid-column: 2; min-width: 116px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); font-weight: 700; padding: 0 14px; }
.prow.st-current { border-color: var(--teal); box-shadow: 0 0 0 2px color-mix(in srgb, var(--teal) 30%, transparent); }
.prow.st-current .pbtn { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); box-shadow: 0 3px 0 var(--teal-deep); }
.prow.st-done .pbtn { background: var(--done-bg); color: var(--done); border-color: transparent; }
.prow.st-late .pbtn, .prow.st-qada .pbtn { background: var(--amber-bg); color: var(--amber-deep); border-color: transparent; }
.prow.st-missed { border-color: var(--miss); }
.prow.st-missed .pbtn { background: var(--miss-bg); color: var(--miss); border-color: transparent; }
.prow.st-upcoming .pbtn { color: var(--muted); cursor: default; }
.prow.st-upcoming { opacity: .85; }

/* generic buttons */
.btn { min-height: 44px; border-radius: 14px; border: 0; background: var(--teal); color: var(--teal-ink); font-weight: 700; padding: 0 18px; box-shadow: 0 4px 0 var(--teal-deep); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--teal-deep); }
.btn.alt { background: var(--surface2); color: var(--text); box-shadow: 0 3px 0 var(--line); }
.btn.alt:active { box-shadow: 0 1px 0 var(--line); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 11px; box-shadow: 0 3px 0 var(--teal-deep); }
.btn.sm:active { box-shadow: 0 1px 0 var(--teal-deep); }
.btn.alt.sm { box-shadow: 0 3px 0 var(--line); }
.btn.alt.sm:active { box-shadow: 0 1px 0 var(--line); }
.btn[disabled] { opacity: .5; cursor: default; box-shadow: none; transform: none; }
.bar { height: 11px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal-deep), var(--teal)); border-radius: 99px; transition: width .5s cubic-bezier(.22,.9,.3,1); }
.bar.amber > i { background: linear-gradient(90deg, var(--amber-deep), var(--amber)); }

/* tabs */
.tabs { flex: none; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs ul { max-width: 640px; margin: 0 auto; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tabs button { width: 100%; background: none; border: 0; display: grid; place-items: center; gap: 2px; padding: 7px 0; border-radius: 14px; font-size: 12.5px; color: var(--muted); }
.tabs button svg { width: 23px; height: 23px; }
.tabs button:active { transform: scale(.92); }
.tabs button[aria-current="page"] { color: var(--teal-ink); background: var(--teal); font-weight: 700; box-shadow: 0 3px 10px -2px color-mix(in srgb, var(--teal) 60%, transparent); }

/* archive */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-block-end: 12px; }
.stat, .dual .stat { background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--teal); border-radius: 12px; padding: 11px 14px; box-shadow: 0 1px 2px color-mix(in srgb, var(--text) 4%, transparent); }
.stats .stat:nth-of-type(2), .dual .stat:nth-of-type(2) { border-inline-start-color: var(--amber); }
.stats .stat:nth-of-type(3) { border-inline-start-color: var(--blue); }
.stats .stat:nth-of-type(4) { border-inline-start-color: var(--done); }
.stats .stat:nth-of-type(5) { border-inline-start-color: var(--teal); }
.stats .stat:nth-of-type(6) { border-inline-start-color: var(--miss); }
.stat b { display: block; font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
.stat span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 3px; text-align: center; border-block-end: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.day { text-align: start; padding-inline-start: 10px; white-space: nowrap; font-size: 14px; font-weight: 500; }
tbody tr:nth-child(even) { background: color-mix(in srgb, var(--surface2) 55%, transparent); }
tr.today { background: color-mix(in srgb, var(--teal) 8%, transparent) !important; }
tr.today td.day { color: var(--teal); font-weight: 700; }
tr:last-child td { border-block-end: 0; }
.dot { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--muted); font-size: 14px; display: inline-grid; place-items: center; padding: 0; }
.dot.done { background: var(--done-bg); color: var(--done); border-color: transparent; }
.dot.late, .dot.qada { background: var(--amber-bg); color: var(--amber-deep); border-color: transparent; }
.dot.missed { background: var(--miss-bg); color: var(--miss); border-color: transparent; }
.dot.upcoming, .dot.future, .dot.na { opacity: .5; cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-block: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-inline-end: 4px; vertical-align: -1px; }

/* quran */
.seg2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg2.two { grid-template-columns: repeat(2, 1fr); }
.seg2 button { min-height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); }
.seg2 button[aria-pressed="true"] { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 700; }
.field { display: grid; gap: 4px; margin-block: 10px; font-size: 14px; color: var(--muted); }
.field input, .field select, .inp { font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-height: 44px; width: 100%; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper b { min-width: 2.5ch; text-align: center; font-family: var(--display); font-size: 24px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 120px; margin-block-start: 8px; }
.week div { display: grid; grid-template-rows: 1fr auto auto; gap: 2px; height: 100%; text-align: center; font-size: 12px; color: var(--muted); }
.week .col { display: flex; align-items: flex-end; }
.week .col i { display: block; width: 100%; background: var(--teal); border-radius: 6px 6px 2px 2px; min-height: 3px; }
.week .col i.full { background: var(--done); }

/* learn */
.units { display: grid; gap: 8px; }
.unit { display: flex; gap: 12px; align-items: center; text-align: start; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.unit .no { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; font-family: var(--display); font-weight: 700; }
.unit .no svg { width: 20px; height: 20px; }
.unit.done .no { background: linear-gradient(145deg, var(--done), var(--done-deep)); color: #fff; }
.pts { display: grid; gap: 8px; margin-block: 8px 14px; padding: 0; list-style: none; }
.pts li { background: var(--surface); border: 1px solid var(--line); border-inline-start: 3px solid var(--teal); border-radius: 10px; padding: 10px 14px; line-height: 1.55; }
.pt-line { margin-block-end: 7px; line-height: 1.6; overflow-wrap: anywhere; }
.pt-line:last-child { margin-block-end: 0; }
.pt-example { margin-block-start: 8px; background: var(--blue-bg); border: 1px solid var(--blue); border-radius: 8px; padding: 9px 12px; font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; }
.pt-example b { color: var(--blue-deep); }
.icon-list { display: grid; gap: 8px; margin-block: 4px 2px; }
.icon-row { display: flex; gap: 10px; align-items: flex-start; background: var(--surface2); border-radius: 10px; padding: 9px 11px; }
.icon-row-e { font-size: 22px; line-height: 1.3; flex: none; }
.icon-row-b { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.55; }
.icon-row-b b { font-weight: 600; }
.cmp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-block: 4px 2px; }
.cmp-col { background: var(--surface2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.cmp-col h4 { font-size: 13.5px; margin: 0 0 6px; color: var(--teal-deep); }
.cmp-col ul { margin: 0; padding-inline-start: 16px; font-size: 13.5px; line-height: 1.55; }
.cmp-col li { margin-block-end: 4px; }
@media (max-width: 380px) { .cmp-grid { grid-template-columns: 1fr; } }
.tree-chain { display: flex; flex-direction: column; align-items: stretch; gap: 2px; margin-block: 4px 2px; }
.tree-step { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: 14.5px; text-align: center; }
.tree-arrow { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.2; }
.opts { display: grid; gap: 8px; margin-block: 12px; }
.opt { min-height: 48px; border-radius: 13px; border: 2px solid var(--line); background: var(--surface); padding: 0 14px; text-align: start; direction: ltr; font-weight: 600; }
.opt.ok { background: var(--done-bg); border-color: var(--done); color: var(--done); }
.opt.bad { background: var(--miss-bg); border-color: var(--miss); color: var(--miss); }
.qtext { font-size: 20px; font-weight: 600; font-family: var(--display); direction: ltr; text-align: start; unicode-bidi: plaintext; line-height: 1.4; }
.qtext.ar { direction: rtl; }
.fb { border-radius: 12px; padding: 10px 14px; margin-block: 8px; font-size: 15px; font-weight: 600; border-inline-start: 3px solid transparent; }
.fb.ok { background: var(--done-bg); color: var(--done); border-inline-start-color: var(--done); }
.fb.bad { background: var(--miss-bg); color: var(--miss); border-inline-start-color: var(--miss); }
.rule { border-radius: 12px; padding: 10px 14px; margin-block: 0 8px; font-size: 14px; line-height: 1.6; background: var(--surface2); border: 1px solid var(--line); border-inline-start: 3px solid var(--teal); color: var(--text); }
.rule b { color: var(--teal); }
.spk { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--teal); display: inline-grid; place-items: center; cursor: pointer; padding: 0; }
.spk svg { width: 18px; height: 18px; }
.spk:active { transform: scale(.92); }
.qtext-row { display: flex; align-items: center; gap: 10px; }
.qtext-row .qtext { flex: 1; }
.ordstrip { min-height: 44px; border: 1px dashed var(--line); border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; margin-block: 10px 8px; background: var(--surface2); }
.ordph { color: var(--muted); font-size: 13px; align-self: center; }
.ordbank { display: flex; flex-wrap: wrap; gap: 8px; }
.ordchip { border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 8px 14px; font-family: var(--display); direction: ltr; font-size: 15px; cursor: pointer; }
.ordchip.on { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); box-shadow: 0 2px 0 var(--teal-deep); }
.ordchip.used { opacity: .35; }
.ordchip:disabled { cursor: default; }
.chipbtn { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 20px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.chipbtn.on { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 700; }
.flash { min-height: 170px; display: grid; place-content: center; text-align: center; gap: 6px; cursor: pointer; }
.flash .w { font-family: var(--display); font-size: 34px; direction: ltr; }
.crumb { font-size: 13.5px; color: var(--muted); font-weight: 600; margin-block-end: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.crumb .num { background: var(--surface2); border-radius: 99px; padding: 2px 10px; font-size: 12.5px; color: var(--text); font-weight: 700; flex: none; }
.linkbtn { background: none; border: 0; color: var(--teal); padding: 4px 0; font-size: 15px; font-weight: 600; }

/* learning path */
.path { position: relative; padding: 10px 2px 4px; }
.path::before { content: ""; position: absolute; inset-inline-start: 50%; top: 8px; bottom: 8px; width: 4px; background: var(--line); border-radius: 99px; transform: translateX(-50%); }
.prow { position: relative; display: flex; align-items: center; gap: 10px; margin-block-end: 20px; z-index: 1; }
.prow.l { justify-content: flex-start; }
.prow.r { justify-content: flex-end; flex-direction: row-reverse; }
.pnode { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--text); box-shadow: 0 3px 0 var(--line); }
.pnode svg { width: 24px; height: 24px; }
.pnode.done { background: linear-gradient(145deg, var(--done), var(--done-deep)); border-color: transparent; color: #fff; box-shadow: 0 3px 0 var(--done-deep); }
.pnode.cur { border-color: var(--teal); box-shadow: 0 3px 0 var(--teal-deep), 0 0 0 5px color-mix(in srgb, var(--teal) 18%, transparent); }
.pnode.lock { opacity: .45; box-shadow: none; }
.pnode.bonus { border-style: dashed; }

  }
  // The Supabase SDK is loaded via a blocking <script> tag before this code runs, so
  // window.supabase is normally ready immediately. On a flaky connection that script
  // can occasionally fail to load; retry it once with a fresh request before giving up
  // on cloud sync for this session (otherwise the app would silently fall back to an
  // empty local-only account even though the person has a real cloud account).
  function loadSupabaseScript() {
    return new Promise(function (resolve) {
      if (window.supabase) { resolve(true); return; }
      var done = false, finish = function (ok) { if (done) return; done = true; resolve(ok); };
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js";
      s.onload = function () { finish(!!window.supabase); };
      s.onerror = function () { finish(false); };
      document.head.appendChild(s);
      setTimeout(function () { finish(!!window.supabase); }, 6000);
    });
  }
  async function initStore() {
    if (!window.supabase) await loadSupabaseScript();

    ready.days = ready.settings = ready.learn = ready.exp = true; checkLoaded(); render();
    var lockEl = document.getElementById("lock"); if (lockEl) lockEl.hidden = true;
  }

  /* ---------------- prayer logic ---------------- */
  function rec(key, i) { var d = state.days[key]; return d && d[PRAYERS[i].k]; }
  function status(key, i, now) {
    var r = rec(key, i);
    if (r && r.t) return r.late ? "late" : (r.qada ? "qada" : "done");
    if (key < state.settings.startDate) return "na";
    if (key > now.key) return "future";
    if (key < now.key) return "missed";
    var w = windowOf(key, i);
    if (now.h < w.start) return "upcoming";
    if (now.h < w.end) return "current";
    return "missed";
  }
  function isDone(st) { return st === "done" || st === "late" || st === "qada"; }
  function dayComplete(key) { var d = state.days[key]; return !!d && PRAYERS.every(function (p) { return d[p.k] && d[p.k].t; }); }
  function streak(now) {
    var k = now.key, n = 0;
    if (!dayComplete(k)) k = addDays(k, -1);
    while (dayComplete(k) && n < 5000) { n++; k = addDays(k, -1); }
    return n;
  }
  function bestStreak() {
    var keys = Object.keys(state.days).sort(), best = 0, cur = 0, prev = null;
    keys.forEach(function (k) {
      if (dayComplete(k)) { cur = (prev && addDays(prev, 1) === k) ? cur + 1 : 1; prev = k; if (cur > best) best = cur; }
      else { cur = 0; prev = null; }
    });
    return best;
  }
  function togglePrayer(key, i) {
    var now = nowR(), st = status(key, i, now), d = state.days[key] || (state.days[key] = {}), k = PRAYERS[i].k;
    if (isDone(st)) { delete d[k]; saveDay(key); toast("تم التراجع عن تسجيل " + pname(key, i)); render(); return; }
    if (st === "upcoming" || st === "future" || st === "na") return;
    var late = (key === now.key && st === "missed");
    d[k] = { t: now.ms };
    if (key < now.key) d[k].qada = 1; else if (late) d[k].late = 1;
    saveDay(key); render();
    toast(key < now.key ? "سُجّل قضاء " + pname(key, i) : (late ? "سُجّلت " + pname(key, i) + " بعد وقتها" : "تقبّل الله طاعتك"));
  }
  function missedList(now) {
    var out = [], k = state.settings.startDate, guard = 0;
    while (k <= now.key && guard++ < 800) {
      for (var i = 0; i < 5; i++) if (status(k, i, now) === "missed") out.push({ key: k, i: i });
      k = addDays(k, 1);
    }
    return out;
  }

  /* ---------------- quran logic ---------------- */
  function target() { var u = UNITS[state.settings.unit] || UNITS.page; return Math.max(1, Math.round(state.settings.amount * u.f)); }
  function pagesOn(key) { var d = state.days[key]; return d && d.q ? d.q : 0; }
  function totalPages() { var t = 0; for (var k in state.days) t += (state.days[k].q || 0); return t; }
  function juzOf(p) { return Math.min(30, p <= 21 ? 1 : Math.floor((p - 2) / 20) + 1); }
  function addPages(n) {
    var key = nowR().key, d = state.days[key] || (state.days[key] = {});
    d.q = Math.max(0, (d.q || 0) + n);
    saveDay(key, 500); render();
  }
  function setPages(n) { var key = nowR().key, d = state.days[key] || (state.days[key] = {}); d.q = Math.max(0, n); saveDay(key, 500); render(); }

  /* ---------------- learning content ---------------- */
  var COURSES = {};
  var COURSE_ORDER = ["en", "iso", "iso14001", "iso45001", "iso22000", "iso17025", "micro"];
  var QINDEX = {}, UNIT_BY_KEY = {};
  function loadCourses() {
    return Promise.all(COURSE_ORDER.map(function (cid) {
      return fetch("courses/" + cid + ".json").then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status + " loading course " + cid);
        return r.json();
      }).then(function (data) { COURSES[cid] = data; });
    }));
  }
  function buildIndexes() {
    COURSE_ORDER.forEach(function (cid) {
      COURSES[cid].units.forEach(function (u) {
        UNIT_BY_KEY[cid + ":" + u.id] = u;
        u.qs.forEach(function (q, i) { q.id = cid + "-" + u.id + "-q" + i; q.u = u.id; q.c = cid; QINDEX[q.id] = q; });
      });
      (COURSES[cid].vocab || []).forEach(function (v) { v.c = cid; });
    });
  }
  var INTERVALS = [0, 1, 3, 7];

  function level() {
    var xp = state.learn.xp || 0, lv = Math.floor(Math.sqrt(xp / 40)) + 1, base = 40 * (lv - 1) * (lv - 1), next = 40 * lv * lv;
    return { lv: lv, xp: xp, pct: Math.round((xp - base) / (next - base) * 100), need: next - xp };
  }
  function addXp(n, now) {
    state.learn.xp = (state.learn.xp || 0) + n;
    var k = (now || nowR()).key;
    state.learn.study[k] = (state.learn.study[k] || 0) + n;
  }
  function studyStreak(now) {
    var k = now.key, n = 0;
    if (!state.learn.study[k]) k = addDays(k, -1);
    while (state.learn.study[k] && n < 5000) { n++; k = addDays(k, -1); }
    return n;
  }
  function dueCards(now, cid, lvl) {
    var list = cid ? (COURSES[cid] ? COURSES[cid].vocab : []) : COURSE_ORDER.reduce(function (a, c) { return COURSES[c] ? a.concat(COURSES[c].vocab) : a; }, []);
    if (lvl) list = list.filter(function (v) { return (v.lvl || 1) === lvl; });
    return list.filter(function (v) { var c = state.learn.cards[v.id]; return !c || c.due <= now.key; });
  }
  function mistakeIds(cid) {
    return Object.keys(state.learn.mistakes).filter(function (id) { return state.learn.mistakes[id] > 0 && QINDEX[id] && (!cid || QINDEX[id].c === cid); });
  }
  function norm(s) { return String(s).toLowerCase().replace(/[‘’ʼ`]/g, "'").replace(/[.!?]+$/g, "").replace(/\s+/g, " ").trim(); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------------- achievements (badges) ---------------- */
  var ACHIEVEMENTS = [
    { id: "dlg100", icon: "chat", title: "محادثة بلا خطأ", desc: "أنهيت محادثة كاملة بدرجة 100%.",
      check: function (s) { return Object.keys(s.learn.units).some(function (k) { var u = UNIT_BY_KEY[k]; return u && u.kind === "dialogue" && (s.learn.units[k].best || 0) >= 100; }); } },
    { id: "fifty", icon: "cap", title: "٥٠ كلمة محفوظة", desc: "وصلت لخمسين كلمة في أعلى مستوى حفظ بالكروت.",
      check: function (s) { return Object.keys(s.learn.cards).filter(function (id) { return s.learn.cards[id].box >= 3; }).length >= 50; } },
    { id: "week7", icon: "flame", title: "أسبوع مذاكرة متواصل", desc: "ذاكرت 7 أيام متتالية من غير ما تفوّت يوم.",
      check: function (s, now) { return studyStreak(now) >= 7; } },

      check: function (s) { return COURSE_ORDER.some(function (cid) { var c = COURSES[cid]; if (!c) return false; var done = c.units.filter(function (u) { var p = s.learn.units[cid + ":" + u.id]; return p && p.done; }).length; return done >= c.units.length; }); } },

  /* ---------------- daily challenge ---------------- */
  function dailyPool() {
    var pool = [];
    COURSE_ORDER.forEach(function (cid) {
      COURSES[cid].units.forEach(function (u) {
        var p = state.learn.units[cid + ":" + u.id];
        if (p && p.done && u.qs) pool = pool.concat(u.qs.map(function (q) { return q.id; }));
      });
    });
    if (pool.length < 5) pool = Object.keys(QINDEX);
    return pool;
  }
  function todaysDaily(now) {
    var d = state.learn.daily;
    return (d && d.key === now.key) ? d : null;
  }
  function startDailyChallenge(now) {
    var d = todaysDaily(now);
    if (!d) {
      var pool = dailyPool(); pool = shuffle(pool).slice(0, Math.min(5, pool.length));
      d = { key: now.key, ids: pool, done: false, score: null };
      state.learn.daily = d; saveMeta("learn", 0);
    }
    var qs = d.ids.map(function (id) { return QINDEX[id]; }).filter(Boolean);
    if (!qs.length) { toast("كمّل شوية وحدات الأول عشان يتجهز لك تحدي يومي"); return; }
    state.quiz = { qs: shuffle(qs), i: 0, ok: 0, ans: null, title: "تحدي اليوم", unit: null, daily: true, wrong: [], right: [], pick: [] };
    state.lv = { mode: "quiz", c: state.lv.c || COURSE_ORDER[0] };
    goTab("learn"); render();
  }

  /* ---------------- speaking challenge ---------------- */
  function speechOK() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
  function startSpeakChallenge(cid) {
    var words = shuffle(COURSES[cid].vocab.slice()).slice(0, 8);
    if (!words.length) return;
    state.spk = { c: cid, q: words, i: 0, ok: 0, result: null, listening: false };
    state.lv = { mode: "speak", c: cid }; render();
  }
  function spkListen() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var s = state.spk; if (!s || !SR) return;
    s.result = null; s.listening = true; render();
    try {
      var r = new SR(); r.lang = "en-US"; r.maxAlternatives = 1;
      r.onresult = function (e) {
        var heard = e.results[0][0].transcript;
        var target = s.q[s.i].en;
        var ok = norm(heard) === norm(target) || norm(heard).indexOf(norm(target)) !== -1;
        if (ok) s.ok++;
        s.result = { heard: heard, ok: ok }; s.listening = false; render();
      };
      r.onerror = function () { s.listening = false; s.result = { heard: "", ok: false, err: true }; render(); };
      r.onend = function () { if (s.listening) { s.listening = false; render(); } };
      r.start();
    } catch (e) { s.listening = false; render(); }
  }
  function spkNext(now) {

      addXp(s.ok * 4, now);

      saveMeta("learn", 0);
      checkAchievements(now);

  }

  /* ---------------- expenses (الحاسبة) ---------------- */
  function monthKey(key) { return key.slice(0, 7); }
  function monthLabel(mk) { var p = mk.split("-"); return AR_MONTHS[Number(p[1]) - 1] + " " + p[0]; }
  function curExpMonth(now) { return state.expMonth || monthKey(now.key); }
  function shiftMonth(mk, n) {

  function ringSVG(sts) {

  function archiveView(now) {

      '<div class="row" style="align-items:center;gap:8px;margin-block-start:12px;padding:8px 10px;border-radius:10px;background:var(--surface2)">' +
      '<span class="muted" style="font-size:12.5px">رمز الدخول الحالي:</span>' +
      '<span class="num" style="font-weight:700;letter-spacing:1px">' + pinDisplay + "</span>" +
      '<button class="chip sm" type="button" data-act="admin-pintoggle" data-uid="' + esc(acc.uid) + '" style="margin-inline-start:auto">' + (shown ? "إخفاء" : "إظهار") + "</button>" +
      "</div>" +
      '<form class="row" data-act="admin-pw" data-uid="' + esc(acc.uid) + '" style="gap:8px;margin-block-start:12px;align-items:center">' +
      '<input class="inp" type="text" inputmode="numeric" placeholder="رمز جديد (4 أرقام)" style="max-width:150px" required pattern="\\d{4,8}">' +
      '<button class="btn sm" type="submit">تغيير الرمز</button>' +
      '<span class="muted pwmsg" style="font-size:12.5px"></span>' +
      "</form>" +
      '<div class="muted togglemsg" style="font-size:12.5px;margin-block-start:6px"></div>' +
      "</div>";
  }
  function adminLegendHTML(stats) {
    return '<div class="row wrapr" style="gap:16px;margin-block-end:10px;font-size:12.5px">' +
      stats.map(function (st, i) {
        return '<span class="row" style="gap:6px;align-items:center"><span style="width:10px;height:10px;border-radius:3px;display:inline-block;background:' + accColor(i) + '"></span>' + esc(st.acc.label) + "</span>";
      }).join("") +
      "</div>";
  }
  function adminCompareHTML(stats) {
    var rows = [
      ["المستوى", function (s) { return s.level; }, function (s) { return "Lv " + s.level; }],
      ["XP", function (s) { return s.xp; }, function (s) { return String(s.xp); }],
      ["أيام مسجّلة", function (s) { return s.totalDays; }, function (s) { return String(s.totalDays); }],
      ["أيام مكتملة", function (s) { return s.completeDays; }, function (s) { return String(s.completeDays); }],
      ["صفحات قرآن", function (s) { return s.totalPages; }, function (s) { return String(s.totalPages); }],
      ["كلمات محفوظة", function (s) { return s.vocabKnown; }, function (s) { return s.vocabKnown + "/" + s.totalVocab; }],
      ["وحدات مكتملة", function (s) { return s.unitsDone; }, function (s) { return s.unitsDone + "/" + s.totalUnits; }]
    ];
    var body = rows.map(function (r) {
      var vals = stats.map(function (st) { return r[1](st.s); });
      var max = Math.max.apply(null, vals.concat([1]));
      var bars = stats.map(function (st, i) {
        var v = r[1](st.s), w = Math.max(2, Math.round((v / max) * 100));
        return '<div class="row" style="align-items:center;gap:6px;margin-block-start:' + (i === 0 ? "0" : "3") + 'px"><div style="flex:1;height:9px;border-radius:4px;background:var(--surface2);overflow:hidden"><div style="width:' + w + '%;height:100%;border-radius:4px;background:' + accColor(i) + '"></div></div><span class="num" style="min-width:46px;text-align:end;font-size:12.5px">' + esc(r[2](st.s)) + "</span></div>";
      }).join("");
      return '<div style="margin-block-end:10px">' +
        '<div class="muted" style="font-size:12.5px;margin-block-end:3px">' + esc(r[0]) + "</div>" +
        bars +
        "</div>";
    }).join("");
    var lastRow = '<div class="row between wrapr" style="font-size:12.5px;padding-block-start:6px;border-block-start:1px dashed var(--line);gap:10px"><span class="muted">آخر نشاط</span><span class="num">' +
      stats.map(function (st) { return esc(st.acc.label) + ": " + (st.s.lastActive ? greg(st.s.lastActive) : "—"); }).join(" · ") + "</span></div>";
    return '<div class="card"><h3 style="margin:0 0 10px">مقارنة بين الحسابات</h3>' + adminLegendHTML(stats) + body + lastRow + "</div>";
  }
  function trendChartSVG(stats) {
    var n = stats[0].s.recent.length;
    var w = 640, h = 160, padL = 6, padB = 20, padT = 8, padR = 6;
    var plotW = w - padL - padR, plotH = h - padT - padB;
    var maxV = Math.max(1, Math.max.apply(null, stats.map(function (st) { return Math.max.apply(null, st.s.recent.map(function (d) { return d.pages; })); })));
    var groupW = plotW / n;
    var count = stats.length;
    var barW = Math.min(13, groupW / Math.max(count, 1) - 3);
    if (barW < 1) barW = 1;
    var bars = "";
    for (var i = 0; i < n; i++) {
      var gx = padL + i * groupW;
      var totalBarsW = count * barW + (count - 1) * 2;
      var startX = gx + groupW / 2 - totalBarsW / 2;
      for (var j = 0; j < count; j++) {
        var v = stats[j].s.recent[i].pages;
        var hgt = Math.max(1, (v / maxV) * plotH);
        var xj = startX + j * (barW + 2);
        bars += '<rect x="' + xj.toFixed(1) + '" y="' + (padT + plotH - hgt).toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + hgt.toFixed(1) + '" rx="2" style="fill:' + accColor(j) + '"><title>' + esc(stats[j].acc.label) + " — " + esc(stats[j].s.recent[i].key) + ": " + v + " صفحة</title></rect>";
      }
      if (i % 2 === 0 || n <= 7) {
        var lbl = stats[0].s.recent[i].key.slice(8) + "/" + stats[0].s.recent[i].key.slice(5, 7);
        bars += '<text x="' + (gx + groupW / 2).toFixed(1) + '" y="' + (h - 4) + '" text-anchor="middle" font-size="9" style="fill:var(--muted)">' + lbl + "</text>";
      }
    }
    bars += '<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (padL + plotW) + '" y2="' + (padT + plotH) + '" style="stroke:var(--line)" stroke-width="1"/>';
    return '<svg viewBox="0 0 ' + w + " " + h + '" style="width:100%;height:140px;display:block" role="img" aria-label="صفحات القرآن في آخر 14 يوم لكل حساب">' + bars + "</svg>";
  }
  function adminTrendCard(stats) {
    return '<div class="card"><h3 style="margin:0 0 6px">صفحات القرآن — آخر 14 يوم</h3>' + adminLegendHTML(stats) + trendChartSVG(stats) + "</div>";
  }
  function donutChartSVG(stats, valueFn) {
    var vals = stats.map(valueFn);
    var total = vals.reduce(function (a, b) { return a + b; }, 0);
    var size = 180, cx = size / 2, cy = size / 2, r = 70, sw = 26;
    var circ = 2 * Math.PI * r;
    var segs = "";
    if (total <= 0) {
      segs = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--surface2)" stroke-width="' + sw + '"/>';
    } else {
      var offset = 0;
      for (var i = 0; i < stats.length; i++) {
        var frac = vals[i] / total;
        if (frac <= 0) continue;
        var len = frac * circ;
        segs += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + accColor(i) + '" stroke-width="' + sw + '" stroke-dasharray="' + len.toFixed(1) + " " + (circ - len).toFixed(1) + '" stroke-dashoffset="' + (-offset).toFixed(1) + '" transform="rotate(-90 ' + cx + " " + cy + ')"><title>' + esc(stats[i].acc.label) + ": " + vals[i] + "</title></circle>";
        offset += len;
      }
    }
    var centerLabel = total > 0 ? String(total) : "0";
    return '<svg viewBox="0 0 ' + size + " " + size + '" style="width:180px;height:180px;display:block;margin-inline:auto" role="img" aria-label="توزيع صفحات القرآن بين الحسابات">' +
      segs +
      '<text x="' + cx + '" y="' + (cy - 3) + '" text-anchor="middle" font-size="22" font-weight="700" style="fill:var(--text)">' + centerLabel + "</text>" +
      '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">إجمالي الصفحات</text>' +
      "</svg>";
  }
  function adminDonutCard(stats) {
    return '<div class="card"><h3 style="margin:0 0 10px">توزيع صفحات القرآن بين الحسابات</h3>' + adminLegendHTML(stats) + donutChartSVG(stats, function (st) { return st.s.totalPages; }) + "</div>";
  }
  async function adminFnCall(payload) {
    var sess = await store.sb.auth.getSession();
    var token = sess.data && sess.data.session && sess.data.session.access_token;
    if (!token) return { error: "انتهت الجلسة، سجّل دخول تاني." };
    try {
      var res = await fetch(ADMIN_FN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token, "apikey": CFG.key },
        body: JSON.stringify(payload)
      });
      var j = await res.json().catch(function () { return {}; });
      if (!res.ok || j.error) return { error: j.error || String(res.status) };
      return { ok: true, data: j };
    } catch (e) { return { error: "تعذّر الاتصال." }; }
  }
  async function adminChangePassword(form) {
    var uid = form.getAttribute("data-uid");
    var input = form.querySelector("input");
    var msgEl = form.querySelector(".pwmsg");
    var newPin = (input.value || "").trim();
    if (!/^\d{4,8}$/.test(newPin)) { msgEl.textContent = "لازم يكون رقم من 4 لـ 8 خانات."; return; }
    msgEl.textContent = "جارٍ التغيير…";
    var r = await adminFnCall({ action: "changePassword", targetUid: uid, newPin: newPin });
    if (r.error) { msgEl.textContent = "تعذّر: " + r.error; return; }
    msgEl.textContent = "تم التغيير ✓"; input.value = "";
    await loadAdminDashboard();
  }
  async function adminToggleActive(btn) {
    var uid = btn.getAttribute("data-uid");
    var curActive = btn.getAttribute("data-active") === "1";
    var msgEl = btn.closest(".card").querySelector(".togglemsg");
    btn.disabled = true;
    if (msgEl) msgEl.textContent = "جارٍ التنفيذ…";
    var r = await adminFnCall({ action: "setActive", targetUid: uid, active: !curActive });
    if (r.error) { if (msgEl) msgEl.textContent = "تعذّر: " + r.error; btn.disabled = false; return; }
    await loadAccountsList();
    await loadAdminDashboard();
  }
  async function adminCreateAccount(form) {
    var labelInput = form.querySelector('[name="label"]');
    var pinInput = form.querySelector('[name="pin"]');
    var msgEl = form.querySelector(".createmsg");
    var label = (labelInput.value || "").trim();
    var pin = (pinInput.value || "").trim();
    if (!label) { msgEl.textContent = "لازم اسم للحساب."; return; }
    if (!/^\d{4,8}$/.test(pin)) { msgEl.textContent = "لازم رمز من 4 لـ 8 خانات."; return; }
    msgEl.textContent = "جارٍ الإضافة…";
    var r = await adminFnCall({ action: "create", label: label, pin: pin });
    if (r.error) { msgEl.textContent = "تعذّر: " + r.error; return; }
    labelInput.value = ""; pinInput.value = "";
    msgEl.textContent = "تمت الإضافة ✓";
    await loadAccountsList();
    await loadAdminDashboard();
  }
  function adminAddAccountCard() {
    return '<div class="card">' +
      '<h3 style="margin:0 0 10px">إضافة حساب جديد</h3>' +
      '<form class="row wrapr" data-act="admin-create" style="gap:8px;align-items:center">' +
      '<input class="inp" type="text" name="label" placeholder="اسم الحساب" style="max-width:180px" required>' +
      '<input class="inp" type="text" name="pin" inputmode="numeric" placeholder="رمز (4 أرقام)" style="max-width:150px" required pattern="\\d{4,8}">' +
      '<button class="btn sm" type="submit">إضافة</button>' +
      '<span class="muted createmsg" style="font-size:12.5px"></span>' +
      "</form></div>";
  }
  var ADMIN_TABS = [
    { id: "accounts", label: "الحسابات" },
    { id: "compare", label: "مقارنة" },
    { id: "charts", label: "رسوم بيانية" }
  ];
  function adminTabsNav(active) {
    return '<div class="row wrapr" style="gap:8px;margin-block-end:4px">' +
      ADMIN_TABS.map(function (t) {
        return '<button class="chip' + (t.id === active ? " active" : "") + '" type="button" data-admtab="' + t.id + '" style="' + (t.id === active ? "background:var(--teal);color:#fff;border-color:var(--teal)" : "") + '">' + esc(t.label) + "</button>";
      }).join("") +
      "</div>";
  }
  function renderAdminDashboard(stats, pinMap) {
    var old = document.getElementById("admin"); if (old) old.remove();
    var wrap = document.createElement("div");
    wrap.id = "admin"; wrap.dir = "rtl"; wrap.lang = "ar";
    wrap.style.cssText = "position:fixed;inset:0;z-index:200;overflow:auto;background:var(--bg);padding:16px";
    var activeStats = stats.filter(function (st) { return st.acc.active !== false; });
    var active = state.adminTab || "accounts";
    var accountsHTML = stats.map(function (st, i) { return adminAccountCard(st.acc, st.s, i, (pinMap || {})[st.acc.uid]); }).join("") + adminAddAccountCard();
    var compareHTML = activeStats.length >= 2 ? adminCompareHTML(activeStats) : '<div class="card muted" style="text-align:center;padding:24px">محتاج حسابين مفعّلين على الأقل للمقارنة.</div>';
    var chartsHTML = activeStats.length >= 1 ? (adminDonutCard(activeStats) + (activeStats.length >= 2 ? adminTrendCard(activeStats) : "")) : '<div class="card muted" style="text-align:center;padding:24px">لا توجد بيانات كافية.</div>';
    wrap.innerHTML = '<div style="max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:12px">' +
      '<div class="row between" style="align-items:center"><h1 style="margin:0">لوحة المتابعة</h1><button class="chip" id="adminlock">قفل</button></div>' +
      adminTabsNav(active) +
      '<div id="admtab-accounts" style="display:' + (active === "accounts" ? "flex" : "none") + ';flex-direction:column;gap:12px">' + accountsHTML + "</div>" +
      '<div id="admtab-compare" style="display:' + (active === "compare" ? "flex" : "none") + ';flex-direction:column;gap:12px">' + compareHTML + "</div>" +
      '<div id="admtab-charts" style="display:' + (active === "charts" ? "flex" : "none") + ';flex-direction:column;gap:12px">' + chartsHTML + "</div>" +
      "</div>";
    document.body.appendChild(wrap);
    document.getElementById("adminlock").addEventListener("click", function () {
      try { store.sb.auth.signOut(); } catch (e) { }
      store.uid = null;
      var a = document.getElementById("admin"); if (a) a.remove();
      showLock("");
    });
    wrap.querySelectorAll("[data-admtab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.adminTab = btn.getAttribute("data-admtab");
        renderAdminDashboard(stats, pinMap);
      });
    });
    wrap.querySelectorAll('[data-act="admin-pw"]').forEach(function (form) {
      form.addEventListener("submit", function (e) { e.preventDefault(); adminChangePassword(form); });
    });
    wrap.querySelectorAll('[data-act="admin-toggle"]').forEach(function (btn) {
      btn.addEventListener("click", function () { adminToggleActive(btn); });
    });
    wrap.querySelectorAll('[data-act="admin-create"]').forEach(function (form) {
      form.addEventListener("submit", function (e) { e.preventDefault(); adminCreateAccount(form); });
    });
    wrap.querySelectorAll('[data-act="admin-pintoggle"]').forEach(function (btn) {
      btn.addEventListener("click", function () {
        var uid = btn.getAttribute("data-uid");
        adminPinsVisible[uid] = !adminPinsVisible[uid];
        renderAdminDashboard(stats, pinMap);
      });
    });
  }
  async function loadAdminDashboard() {
    if (!store.uid) return;
    var dRes = await store.sb.from("masar_days").select("user_id,day,data");
    var mRes = await store.sb.from("masar_meta").select("user_id,name,data");
    if (dRes.error || mRes.error) {
      toast("تعذّر تحميل بيانات اللوحة: " + ((dRes.error || mRes.error).message || ""));
      return;
    }
    var pinRes = await adminFnCall({ action: "listAccounts" });
    var pinMap = {};
    if (pinRes.ok && pinRes.data && pinRes.data.accounts) {
      pinRes.data.accounts.forEach(function (a) { pinMap[a.uid] = a.pin; });
    }
    var accounts = ACCOUNTS.filter(function (a) { return a.role === "user"; });
    var stats = accounts.map(function (acc) {
      var days = {};
      (dRes.data || []).forEach(function (r) { if (r.user_id === acc.uid) days[r.day] = r.data || {}; });
      var learn = { xp: 0, units: {}, cards: {} };
      (mRes.data || []).forEach(function (r) { if (r.user_id === acc.uid && r.name === "learn") learn = Object.assign({ xp: 0, units: {}, cards: {} }, r.data || {}); });
      return { acc: acc, s: computeAccountStats(days, learn) };
    });
    renderAdminDashboard(stats, pinMap);
  }
  async function loadSupa(first) {
    if (!store.uid) return;
    var before = snap();
    var d = await store.sb.from("masar_days").select("day,data");
    var m = await store.sb.from("masar_meta").select("name,data");
    if (d.error || m.error) {
      var err = (d.error || m.error).message || "";
      toast("تعذّر تحميل البيانات: " + err);
      if (first) { ready.days = ready.settings = ready.learn = ready.exp = true; checkLoaded(); render(); }
      return;
    }
    (d.data || []).forEach(function (r) { if (!dirty["day:" + r.day]) state.days[r.day] = r.data || {}; });
    var hasSettings = false;
    (m.data || []).forEach(function (r) {
      if (r.name === "settings") { hasSettings = true; if (!dirty["meta:settings"]) Object.assign(state.settings, r.data); }
      if (r.name === "learn" && !dirty["meta:learn"]) state.learn = Object.assign(freshLearn(), r.data);
      if (r.name === "exp" && !dirty["meta:exp"]) state.exp = Object.assign({ categories: [], items: [], salary: {} }, r.data);
    });
    if (!hasSettings && first) { state.settings.startDate = nowR().key; saveMeta("settings"); }
    ensureNotesSeed();
    ready.days = ready.settings = ready.learn = ready.exp = true;
    var wasLoaded = state.loaded; checkLoaded();
    if (wasLoaded && snap() !== before) render();
  }
  async function lockNow() {
    clearInterval(store.poll);
    try { await store.sb.auth.signOut(); } catch (e) { }
    store.uid = null; state.days = {}; state.learn = freshLearn();
    state.settings = { startDate: nowR().key, unit: "page", amount: 5, startPage: 1 };
    state.exp = { categories: [], items: [], salary: {} }; state.expMonth = null; state.expAdd = false; state.expCat = ""; state.expNewCat = false; state.expSalEdit = false;
    state.loaded = false; ready.days = ready.settings = ready.learn = ready.exp = false;
    state.quiz = null; state.card = null; state.spk = null; state.lv = { mode: "courses" }; state.tab = "home"; state.pv = "today"; panelCache = {};
    $("#pager").scrollTo({ left: 0 }); render(); showLock("");
  }
  $("#lockform").addEventListener("submit", function (e) { e.preventDefault(); var v = $("#pin").value.trim(); if (v) unlock(v); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && state.mode === "supa" && store.uid) loadSupa(false); });

  /* ---------------- pager sync ---------------- */
  // Uses IntersectionObserver (not scrollLeft math) so it works regardless of how a
  // browser signs scrollLeft in an RTL container (this differs across engines and was
  // the root cause of the active tab not updating on a manual swipe).
  (function () {
    var pager = $("#pager");
    if (window.IntersectionObserver) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.intersectionRatio >= 0.55) {
            var t = en.target.id.replace("p-", "");
            if (t && t !== state.tab) { state.tab = t; markTabs(); }
          }
        });
      }, { root: pager, threshold: [0.55] });
      TABS.forEach(function (t) { var el = $("#p-" + t); if (el) io.observe(el); });
    } else {
      var tm;
      pager.addEventListener("scroll", function () {
        clearTimeout(tm);
        tm = setTimeout(function () {
          var max = pager.scrollWidth - pager.clientWidth;
          if (max <= 0) return;
          var frac = Math.abs(pager.scrollLeft) / max;
          var i = Math.round(frac * (TABS.length - 1)), t = TABS[i];
          if (t && t !== state.tab) { state.tab = t; markTabs(); }
        }, 90);
      }, { passive: true });
    }
  })();

  /* ---------------- boot ---------------- */
  // Course data (COURSES) now loads from separate JSON files instead of being
  // inlined in this script. That fetch must never block login/sync: it runs
  // in parallel with the normal boot sequence, not before it, so a slow or
  // failed course-data fetch can't make the whole app (PIN screen included)
  // look broken. If the user is already on the "learn" tab when the data
  // lands, re-render so the courses list appears without needing a tap.
  var coursesReady = loadCourses().then(function () {
    buildIndexes();
    if (state.tab === "learn") render();
  }).catch(function (err) {
    console.error("Masar: failed to load course data", err);
    if (state.tab === "learn") render();
  });
  applyTheme(getTheme());
  render();
  setInterval(tick, 1000);
  initStore();
})();
</script>
