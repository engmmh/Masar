<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>مسار</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مسار">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #F1F4F2;
  --surface: #FFFFFF;
  --surface2: #E6ECE9;
  --text: #14231F;
  --muted: #56675F;
  --line: #D3DDD9;
  --teal: #0F5C5A;
  --teal-ink: #FFFFFF;
  --amber: #B86E0B;
  --amber-bg: #FBEBCF;
  --blue: #3B5BA9;
  --done: #2A7D4B;
  --done-bg: #DDF0E4;
  --miss: #B5443B;
  --miss-bg: #F8E1DE;
  --display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B1514; --surface: #132220; --surface2: #1B2E2B; --text: #E6F0ED; --muted: #9CB0AA; --line: #263A36;
    --teal: #4CC2B8; --teal-ink: #06201E; --amber: #F0B34A; --amber-bg: #3A2C10;
    --done: #6FD09A; --done-bg: #16362A; --miss: #FF8E82; --miss-bg: #3A1E1B; --blue: #8FA8F0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B1514; --surface: #132220; --surface2: #1B2E2B; --text: #E6F0ED; --muted: #9CB0AA; --line: #263A36;
  --teal: #4CC2B8; --teal-ink: #06201E; --amber: #F0B34A; --amber-bg: #3A2C10;
  --done: #6FD09A; --done-bg: #16362A; --miss: #FF8E82; --miss-bg: #3A1E1B; --blue: #8FA8F0;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.6; overflow: hidden; }
#shell { position: fixed; inset: 0; max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; background: var(--bg); }
#top { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px; }
#top h1 { font-size: 26px; }
#top .dates { font-size: 13px; color: var(--muted); line-height: 1.4; }
#top .chip { border: 0; color: var(--text); min-height: 34px; cursor: pointer; }
#pager { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
#pager::-webkit-scrollbar { display: none; }
.panel { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; overscroll-behavior-y: contain; padding: 4px 16px 28px; -webkit-overflow-scrolling: touch; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.en { direction: ltr; unicode-bidi: isolate; display: inline-block; font-weight: 500; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.muted { color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

/* top */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-block: 6px 12px; }
.top h1 { font-size: 26px; }
.top .dates { font-size: 14px; color: var(--muted); }
.chip { display: inline-flex; gap: 6px; align-items: center; background: var(--surface2); border-radius: 99px; padding: 2px 12px; font-size: 14px; white-space: nowrap; }
.banner { background: var(--amber-bg); color: var(--text); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-block-end: 12px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-block-end: 12px; }
.card h2 { font-size: 20px; margin-block-end: 8px; }
.card h3 { font-size: 17px; margin-block-end: 6px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.wrapr { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* hero */
.hero { display: flex; gap: 16px; align-items: center; }
.ringbox { position: relative; width: 132px; height: 132px; flex: none; }
.ring { width: 100%; height: 100%; }
.seg { stroke: var(--surface2); }
.seg.done { stroke: var(--done); }
.seg.late { stroke: var(--amber); }
.seg.current { stroke: var(--teal); }
.seg.missed { stroke: var(--miss); }
.ringtxt { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ringtxt b { font-family: var(--display); font-size: 34px; font-weight: 700; }
.ringtxt span { font-size: 12px; color: var(--muted); }
.next .lbl { font-size: 13px; color: var(--muted); }
.next .nm { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.15; }
.next .cd { font-size: 20px; font-weight: 600; color: var(--teal); }
.next .sub { font-size: 14px; color: var(--muted); }
.streak { display: inline-flex; gap: 6px; align-items: center; margin-block-start: 8px; color: var(--amber); font-weight: 600; font-size: 15px; }
.streak svg { width: 18px; height: 18px; }

/* alerts */
.alert { background: var(--miss-bg); border: 1px solid var(--miss); }
.alert h2 { color: var(--miss); font-size: 18px; }
.miss-list { display: grid; gap: 6px; margin-block-start: 8px; }
.miss-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--surface); border-radius: 10px; padding: 6px 12px; font-size: 15px; }

/* prayers */
.prow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-block-end: 8px; }
.prow .pn { font-family: var(--display); font-size: 20px; font-weight: 600; }
.prow .pt { font-size: 15px; color: var(--muted); }
.prow .pbtn { grid-row: 1 / span 2; grid-column: 2; min-width: 116px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); font-weight: 600; padding: 0 14px; }
.prow.st-current { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal) inset; }
.prow.st-current .pbtn { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }
.prow.st-done .pbtn { background: var(--done-bg); color: var(--done); border-color: var(--done); }
.prow.st-late .pbtn, .prow.st-qada .pbtn { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
.prow.st-missed { border-color: var(--miss); }
.prow.st-missed .pbtn { background: var(--miss-bg); color: var(--miss); border-color: var(--miss); }
.prow.st-upcoming .pbtn { color: var(--muted); cursor: default; }
.prow.st-upcoming { opacity: .85; }

/* generic buttons */
.btn { min-height: 44px; border-radius: 12px; border: 1px solid var(--teal); background: var(--teal); color: var(--teal-ink); font-weight: 600; padding: 0 18px; }
.btn.alt { background: var(--surface2); color: var(--text); border-color: var(--line); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: .5; cursor: default; }
.bar { height: 10px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--teal); border-radius: 99px; }
.bar.amber > i { background: var(--amber); }

/* tabs */
.tabs { flex: none; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs ul { max-width: 640px; margin: 0 auto; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tabs button { width: 100%; background: none; border: 0; display: grid; place-items: center; gap: 2px; padding: 6px 0; border-radius: 12px; font-size: 13px; color: var(--muted); }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--teal); background: var(--surface2); font-weight: 600; }

/* archive */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-block-end: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.stat b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.2; }
.stat span { font-size: 13px; color: var(--muted); }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 4px 3px; text-align: center; border-block-end: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
td.day { text-align: start; padding-inline-start: 10px; white-space: nowrap; font-size: 14px; }
tr.today td.day { color: var(--teal); font-weight: 600; }
tr:last-child td { border-block-end: 0; }
.dot { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--muted); font-size: 14px; display: inline-grid; place-items: center; padding: 0; }
.dot.done { background: var(--done-bg); color: var(--done); border-color: var(--done); }
.dot.late, .dot.qada { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
.dot.missed { background: var(--miss-bg); color: var(--miss); border-color: var(--miss); }
.dot.upcoming, .dot.future, .dot.na { opacity: .5; cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-block: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-inline-end: 4px; vertical-align: -1px; }

/* quran */
.seg2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg2.two { grid-template-columns: repeat(2, 1fr); }
.seg2 button { min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); }
.seg2 button[aria-pressed="true"] { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 600; }
.field { display: grid; gap: 4px; margin-block: 10px; font-size: 14px; color: var(--muted); }
.field input, .field select, .inp { font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 44px; width: 100%; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper b { min-width: 2.5ch; text-align: center; font-family: var(--display); font-size: 24px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 120px; margin-block-start: 8px; }
.week div { display: grid; grid-template-rows: 1fr auto auto; gap: 2px; height: 100%; text-align: center; font-size: 12px; color: var(--muted); }
.week .col { display: flex; align-items: flex-end; }
.week .col i { display: block; width: 100%; background: var(--teal); border-radius: 6px 6px 2px 2px; min-height: 3px; }
.week .col i.full { background: var(--done); }

/* learn */
.units { display: grid; gap: 8px; }
.unit { display: flex; gap: 12px; align-items: center; text-align: start; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.unit .no { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; font-family: var(--display); font-weight: 700; }
.unit .no svg { width: 20px; height: 20px; }
.unit.done .no { background: var(--done); color: var(--teal-ink); }
.pts { display: grid; gap: 8px; margin-block: 8px 14px; padding: 0; list-style: none; }
.pts li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.opts { display: grid; gap: 8px; margin-block: 12px; }
.opt { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; text-align: start; direction: ltr; font-weight: 500; }
.opt.ok { background: var(--done-bg); border-color: var(--done); color: var(--done); }
.opt.bad { background: var(--miss-bg); border-color: var(--miss); color: var(--miss); }
.qtext { font-size: 20px; font-family: var(--display); direction: ltr; text-align: start; unicode-bidi: plaintext; }
.qtext.ar { direction: rtl; }
.fb { border-radius: 12px; padding: 10px 14px; margin-block: 8px; font-size: 15px; }
.fb.ok { background: var(--done-bg); color: var(--done); }
.fb.bad { background: var(--miss-bg); color: var(--miss); }
.rule { border-radius: 12px; padding: 10px 14px; margin-block: 0 8px; font-size: 14px; line-height: 1.6; background: var(--surface2); border: 1px dashed var(--line); color: var(--text); }
.rule b { color: var(--teal); }
.spk { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--teal); display: inline-grid; place-items: center; cursor: pointer; padding: 0; }
.spk svg { width: 18px; height: 18px; }
.spk:active { transform: scale(.92); }
.qtext-row { display: flex; align-items: center; gap: 10px; }
.qtext-row .qtext { flex: 1; }
.flash { min-height: 170px; display: grid; place-content: center; text-align: center; gap: 6px; cursor: pointer; }
.flash .w { font-family: var(--display); font-size: 34px; direction: ltr; }
.crumb { font-size: 14px; color: var(--muted); margin-block-end: 8px; }
.linkbtn { background: none; border: 0; color: var(--teal); padding: 4px 0; font-size: 15px; }

/* learning path */
.path { position: relative; padding: 10px 2px 4px; }
.path::before { content: ""; position: absolute; inset-inline-start: 50%; top: 8px; bottom: 8px; width: 3px; background: var(--line); transform: translateX(-50%); }
.prow { position: relative; display: flex; align-items: center; gap: 10px; margin-block-end: 20px; z-index: 1; }
.prow.l { justify-content: flex-start; }
.prow.r { justify-content: flex-end; flex-direction: row-reverse; }
.pnode { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.pnode svg { width: 24px; height: 24px; }
.pnode.done { background: var(--done); border-color: var(--done); color: var(--teal-ink); }
.pnode.cur { border-color: var(--teal); box-shadow: 0 0 0 5px color-mix(in srgb, var(--teal) 18%, transparent); }
.pnode.lock { opacity: .45; }
.pnode.bonus { border-style: dashed; }
.plbl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; max-width: 60%; font-size: 13.5px; font-weight: 600; line-height: 1.35; }
.plbl small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-block-start: 2px; }

/* step-by-step lesson */
.ldots { display: flex; gap: 6px; justify-content: center; margin-block-end: 14px; }
.ldots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block; }
.ldots i.on { background: var(--teal); width: 20px; border-radius: 5px; }
.lstep-card { min-height: 160px; display: grid; align-content: center; gap: 10px; text-align: center; padding: 22px 16px; }
.lstep-card .tag { font-size: 13px; color: var(--muted); font-weight: 600; }
.lstep-card .txt { font-size: 19px; line-height: 1.7; }
.lnav { display: flex; gap: 10px; margin-block-start: 14px; }
.lnav .btn { flex: 1; }

/* dialogue */
.chat { display: grid; gap: 10px; margin-block: 8px 14px; }
.bub { max-width: 82%; border-radius: 16px; padding: 10px 14px; }
.bub .en { direction: ltr; unicode-bidi: plaintext; font-family: var(--display); font-size: 16px; display: flex; align-items: center; gap: 8px; }
.bub .en .spk { width: 26px; height: 26px; background: transparent; border-color: currentColor; color: var(--text); opacity: .8; }
.bub .en .spk svg { width: 15px; height: 15px; }
.bub.b .en .spk { color: var(--teal-ink); }
.bub .ar { font-size: 13px; color: var(--muted); margin-block-start: 3px; }
.bub.a { background: var(--surface2); border-start-start-radius: 4px; justify-self: start; }
.bub.b { background: var(--teal); color: var(--teal-ink); border-start-end-radius: 4px; justify-self: end; }
.bub.b .ar { color: color-mix(in srgb, var(--teal-ink) 75%, transparent); }

#lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: 24px; }
#lock[hidden] { display: none; }
#lockform { width: 100%; max-width: 320px; display: grid; gap: 12px; text-align: center; }
#lockform h1 { font-size: 40px; }
#pin { font: inherit; font-size: 28px; letter-spacing: .4em; text-align: center; direction: ltr; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 14px; min-height: 56px; width: 100%; }
#lockmsg { min-height: 1.6em; font-size: 14px; color: var(--miss); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { position: relative; display: grid; gap: 4px; justify-items: center; align-content: start; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 6px 12px; }
.tile .ic { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--surface2); margin-block-end: 4px; }
.tile .ic svg { width: 28px; height: 28px; }
.tile.t-prayer .ic { color: var(--teal); }
.tile.t-quran .ic { color: var(--amber); }
.tile.t-learn .ic { color: var(--blue); }
.tile b { font-family: var(--display); font-size: 18px; font-weight: 600; }
.tile small { font-size: 12px; color: var(--muted); line-height: 1.45; }
.tile .badge { position: absolute; top: 8px; inset-inline-start: 8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: var(--miss); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.sec-h { font-family: var(--display); font-size: 17px; font-weight: 600; margin-block: 16px 8px; color: var(--muted); }
.dual { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-block-end: 12px; }
.dual .stat b { font-size: 22px; }
.dual .bar { margin-block-start: 8px; height: 8px; }
:root[data-theme="light"] { color-scheme: light; }
#toast { position: fixed; inset-inline: 16px; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 420px; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<div id="lock" dir="rtl" lang="ar" hidden>
  <form id="lockform" autocomplete="on">
    <h1>مسار</h1>
    <p class="muted">اكتب الرمز للدخول</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••" aria-label="الرمز" required>
    <button class="btn" type="submit" id="pinbtn">دخول</button>
    <p id="lockmsg" role="alert"></p>
  </form>
</div>
<div id="shell" dir="rtl" lang="ar">
  <header id="top">
    <div><h1>مسار</h1><div class="dates" id="dates"></div></div>
    <div class="row" style="gap:6px">
      <button class="chip" id="theme" data-act="theme" aria-label="تغيير المظهر">نهاري</button>
      <button class="chip" id="lockbtn" data-act="lock" hidden>قفل</button>
    </div>
  </header>
  <main id="pager" aria-label="الأقسام، اسحب يمينًا أو يسارًا للتنقل">
    <section class="panel" id="p-home" aria-label="الرئيسية"></section>
    <section class="panel" id="p-prayer" aria-label="الصلاة"></section>
    <section class="panel" id="p-quran" aria-label="القرآن"></section>
    <section class="panel" id="p-learn" aria-label="الكورسات"></section>
  </main>
  <nav class="tabs" aria-label="التنقل">
    <ul>

  /* ---------------- prayer times (Umm al-Qura, Riyadh) ---------------- */
  var rad = Math.PI / 180, deg = 180 / Math.PI;

  function angleTime(jd, ang, t, ccw) {

  /* ---------------- prayer logic ---------------- */

  function lessonSteps(u) { return u.pts; }
  function lessonHTML(cid, id, step) {
    var u = unitOf(cid, id), p = state.learn.units[cid + ":" + id] || {};
    var steps = lessonSteps(u), n = steps.length, i = Math.max(0, Math.min(n - 1, step));
    var dots = steps.map(function (_, k) { return '<i class="' + (k === i ? "on" : "") + '"></i>'; }).join("");
    var last = i >= n - 1;
    return '<button class="linkbtn" data-act="lhome" data-c="' + cid + '">← رجوع للكورس</button>' +
      '<div class="card"><h2>' + esc(u.icon + ". " + u.title) + '</h2>' +
      '<div class="ldots">' + dots + '</div>' +
      '<div class="lstep-card"><span class="tag">نقطة <span class="num">' + (i + 1) + "</span> من <span class=\"num\">" + n + '</span></span><div class="txt">' + fmtEn(steps[i]) + '</div></div>' +
      '<div class="lnav">' +
      '<button class="btn alt" data-act="lstep" data-c="' + cid + '" data-u="' + id + '" data-d="-1"' + (i === 0 ? " disabled" : "") + '>السابق</button>' +
      (last
        ? '<button class="btn" data-act="quiz" data-c="' + cid + '" data-u="' + id + '">ابدأ التدريب (' + u.qs.length + ' أسئلة)</button>'
        : '<button class="btn" data-act="lstep" data-c="' + cid + '" data-u="' + id + '" data-d="1">التالي</button>') +
      "</div>" +
      '<button class="linkbtn" style="margin-block-start:10px" data-act="unit-flat" data-c="' + cid + '" data-u="' + id + '">عرض كل النقاط دفعة واحدة</button>' +
      (p.best != null ? '<p class="muted" style="font-size:14px;margin-block-start:8px">أفضل نتيجة سابقة: ' + p.best + "%</p>" : "") + "</div>";
  }
  function unitFlatHTML(cid, id) {
    var u = unitOf(cid, id), p = state.learn.units[cid + ":" + id] || {};
    return '<button class="linkbtn" data-act="lhome" data-c="' + cid + '">← رجوع للكورس</button><div class="card"><h2>' + esc(u.icon + ". " + u.title) + '</h2><ul class="pts">' +
      u.pts.map(function (t) { return "<li>" + fmtEn(t) + "</li>"; }).join("") + "</ul>" +
      '<button class="btn" data-act="quiz" data-c="' + cid + '" data-u="' + id + '">ابدأ التدريب (' + u.qs.length + " أسئلة)</button>" +
      (p.best != null ? '<p class="muted" style="font-size:14px;margin-block-start:8px">أفضل نتيجة: ' + p.best + "%</p>" : "") + "</div>";
  }
  function dialogueHTML(cid, id) {
    var u = unitOf(cid, id), p = state.learn.units[cid + ":" + id] || {};
    var bubbles = u.dialogue.map(function (t) {
      return '<div class="bub ' + t.who + '"><div class="en"><span>' + esc(t.en) + "</span>" + spkBtn(t.en) + '</div><div class="ar">' + esc(t.ar) + "</div></div>";
    }).join("");
    return '<button class="linkbtn" data-act="lhome" data-c="' + cid + '">← رجوع للكورس</button><div class="card"><h2>' + esc(u.title) + '</h2>' +
      '<p class="muted" style="font-size:14px;margin-block-end:6px">' + fmtEn(u.pts[0]) + '</p>' +
      '<div class="chat">' + bubbles + '</div>' +
      '<button class="btn" data-act="quiz" data-c="' + cid + '" data-u="' + id + '">جاوب على أسئلة الحوار (' + u.qs.length + ' أسئلة)</button>' +
      (p.best != null ? '<p class="muted" style="font-size:14px;margin-block-start:8px">أفضل نتيجة: ' + p.best + "%</p>" : "") + "</div>";
  }
  function startQuiz(qs, title, unitId) {
    state.quiz = { qs: shuffle(qs), i: 0, ok: 0, ans: null, title: title, unit: unitId, wrong: [], right: [] };
    state.lv = { mode: "quiz", c: state.lv.c }; render();
  }
  function quizHTML() {
    var z = state.quiz; if (!z) return "";
    if (z.i >= z.qs.length) return quizEnd(z);
    var q = z.qs[z.i], a = z.ans, body;
    var arQ = /[؀-ۿ]/.test(q.q);
    if (q.t === "mcq") {
      body = '<div class="opts">' + q.o.map(function (o, k) {
        var c = "opt"; if (a) { if (o === q.a) c += " ok"; else if (o === a.sel) c += " bad"; }
        return '<button class="' + c + '" data-act="pick" data-k="' + k + '"' + (a ? " disabled" : "") + ">" + esc(o) + "</button>";
      }).join("") + "</div>";
    } else {
      body = '<div class="opts"><input class="inp" id="ans" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اكتب الإجابة" value="' + (a ? esc(a.sel) : "") + '"' + (a ? " disabled" : "") + ">" +
        (a ? "" : '<button class="btn" data-act="submit">تحقق</button>') + "</div>";
    }
    var correctTxt = Array.isArray(q.a) ? q.a[0] : q.a;
    var fb = "";
    if (a) fb = '<div class="fb ' + (a.ok ? "ok" : "bad") + '">' + (a.ok ? "✓ صحيح" : "✕ الصواب: <span class=\"en\">" + esc(correctTxt) + "</span>" + spkBtn(correctTxt)) + "</div>" +
      (q.why ? '<div class="rule"><b>📘 القاعدة:</b> ' + esc(q.why) + "</div>" : "") +
      '<button class="btn" data-act="qnext">' + (z.i + 1 >= z.qs.length ? "النتيجة" : "التالي") + "</button>";
    var qRow = '<p class="qtext' + (arQ ? " ar" : "") + '" style="margin-block-start:14px">' + esc(q.q) + "</p>";
    if (!arQ) qRow = '<div class="qtext-row" style="margin-block-start:14px">' + '<p class="qtext" style="margin:0">' + esc(q.q) + "</p>" + spkBtn(q.q.replace(/___/g, "")) + "</div>";
    return '<button class="linkbtn" data-act="lhome">← إنهاء</button><div class="card"><div class="crumb">' + esc(z.title) + " · " + (z.i + 1) + " من " + z.qs.length + '</div><div class="bar"><i style="width:' + Math.round(z.i / z.qs.length * 100) + '%"></i></div>' +
      qRow + body + fb + "</div>";
  }
  function quizEnd(z) {
    var pct = Math.round(z.ok / z.qs.length * 100);
    var retryC = "", retryU = "";
    if (z.unit) { var parts = z.unit.split(":"); retryC = parts[0]; retryU = parts[1]; }
    return '<div class="card"><h2>' + (pct >= 80 ? "ممتاز" : (pct >= 50 ? "جيد" : "كمّل وراجع")) + '</h2><p style="font-size:20px" class="num">' + z.ok + " / " + z.qs.length + " (" + pct + '%)</p><p class="muted" style="margin-block:6px 12px">حصلت على <span class="num">' + z.gain + "</span> نقطة." + (z.wrong.length ? " الأسئلة الخاطئة ستظهر في مراجعة الأخطاء." : "") + '</p><div class="row wrapr"><button class="btn" data-act="lhome">رجوع</button>' +
      (z.unit ? '<button class="btn alt" data-act="quiz" data-c="' + retryC + '" data-u="' + retryU + '">أعد التدريب</button>' : "") + "</div></div>";
  }
  function finishQuiz() {
    var z = state.quiz, now = nowR(), pct = Math.round(z.ok / z.qs.length * 100), gain = z.ok * 10;
    z.wrong.forEach(function (id) { state.learn.mistakes[id] = (state.learn.mistakes[id] || 0) + 1; });
    z.right.forEach(function (id) { if (state.learn.mistakes[id]) { state.learn.mistakes[id]--; if (state.learn.mistakes[id] <= 0) delete state.learn.mistakes[id]; } });
    if (z.unit) {
      var p = state.learn.units[z.unit] || {};
      p.best = Math.max(p.best || 0, pct); p.tries = (p.tries || 0) + 1;
      if (pct >= 80 && !p.done) { p.done = true; gain += 30; }
      state.learn.units[z.unit] = p;
    }
    z.gain = gain; addXp(gain, now); saveMeta("learn", 0);
  }
  function cardsHTML() {
    var c = state.card; if (!c) return "";
    if (c.i >= c.q.length) return '<div class="card"><h2>خلّصت مراجعة اليوم</h2><p class="muted" style="margin-block:6px 12px">عرفت <span class="num">' + c.known + "</span> من <span class=\"num\">" + c.q.length + '</span>. الكلمات اللي لم تعرفها ترجع لك غدًا.</p><button class="btn" data-act="lhome">رجوع</button></div>';
    var w = c.q[c.i];
    var face = c.flip ? '<div class="w" style="direction:rtl;font-size:30px">' + esc(w.ar) + '</div><div class="en muted">' + esc(w.ex) + "</div>" + spkBtn(w.en) : '<div class="w">' + esc(w.en) + "</div>" + spkBtn(w.en) + '<div class="muted">اضغط لإظهار المعنى</div>';
    return '<button class="linkbtn" data-act="lhome">← إنهاء</button><div class="card"><div class="crumb">كروت المفردات · ' + (c.i + 1) + " من " + c.q.length + '</div><div class="card flash" data-act="flip" role="button" tabindex="0">' + face + "</div>" +
      (c.flip ? '<div class="row"><button class="btn grow" data-act="know" data-v="1">عرفتها</button><button class="btn alt grow" data-act="know" data-v="0">لم أعرفها</button></div>' : "") + "</div>";
  }

  /* ---------------- render ---------------- */
  var TABS = ["home", "prayer", "quran", "learn"], panelCache = {};
  var THEMES = ["light", "dark", "auto"], THEME_LBL = { light: "نهاري", dark: "ليلي", auto: "تلقائي" };
  function getTheme() { try { return localStorage.getItem("masar:theme") || "light"; } catch (e) { return "light"; } }
  function applyTheme(t) {
    var r = document.documentElement;
    if (t === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", t);
    var b = $("#theme"); if (b) b.textContent = THEME_LBL[t];
  }
  function markTabs() {
    document.querySelectorAll(".tabs button").forEach(function (b) {
      if (b.getAttribute("data-t") === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
  }
  function goTab(t) {
    state.tab = t; markTabs();
    var el = $("#p-" + t); if (el) el.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
  }
  function render() {
    var now = nowR();
    var views = { home: homeView(now), prayer: prayerView(now), quran: quranView(now), learn: learnView(now) };
    var active = document.activeElement, keepId = active && active.id, keepVal = active && active.value, keepSel = active && active.selectionStart;
    TABS.forEach(function (k) {
      if (panelCache[k] !== views[k]) {
        var el = $("#p-" + k), st = el.scrollTop; el.innerHTML = views[k]; el.scrollTop = st; panelCache[k] = views[k];
      }
    });
    if (keepId) { var el2 = document.getElementById(keepId); if (el2 && el2.tagName === "INPUT" && el2.type !== "date") { el2.value = keepVal; el2.focus(); try { el2.setSelectionRange(keepSel, keepSel); } catch (e) { } } }
    var h = hijri(now.key); $("#dates").textContent = greg(now.key) + (h ? " · " + h : "");
    $("#lockbtn").hidden = state.mode !== "supa";
    markTabs();
    lastSig = signature();
  }
  var lastSig = "";
  function signature() {
    var now = nowR();
    return now.key + ":" + PRAYERS.map(function (p, i) { return status(now.key, i, now); }).join(",");
  }
  function tick() {
    var el = $("#cd");
    if (el) {
      var now = nowR(), left = (parseFloat(el.getAttribute("data-t")) - now.h) * 3600;
      el.textContent = fmtDur(left);
    }
    if (signature() !== lastSig) render();
  }

  /* ---------------- events ---------------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
    var act = el.getAttribute("data-act"), now = nowR();
    switch (act) {
      case "lock": lockNow(); break;
      case "speak": speak(el.getAttribute("data-txt")); break;
      case "theme": var cur = getTheme(), nx = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]; try { localStorage.setItem("masar:theme", nx); } catch (er) { } applyTheme(nx); break;
      case "pv": state.pv = el.getAttribute("data-v"); render(); break;
      case "tab": var tt = el.getAttribute("data-t"); if (tt === "archive") { state.pv = "archive"; tt = "prayer"; } goTab(tt); render(); break;
      case "tp": togglePrayer(el.getAttribute("data-d"), Number(el.getAttribute("data-p"))); break;
      case "more": state.archiveN += 30; render(); break;
      case "pg": addPages(Number(el.getAttribute("data-n"))); break;
      case "pgdone": setPages(Math.max(pagesOn(now.key), target())); toast("تقبّل الله ورد اليوم"); break;
      case "unit": state.settings.unit = el.getAttribute("data-u"); saveMeta("settings", 400); render(); break;
      case "amt": state.settings.amount = Math.max(1, Math.min(60, state.settings.amount + Number(el.getAttribute("data-n")))); saveMeta("settings", 400); render(); break;
      case "lcourses": state.lv = { mode: "courses" }; state.quiz = null; state.card = null; render(); break;
      case "course-open": state.lv = { mode: "home", c: el.getAttribute("data-c") }; $("#p-learn").scrollTop = 0; render(); break;
      case "lhome": state.lv = { mode: "home", c: el.getAttribute("data-c") || state.lv.c }; state.quiz = null; state.card = null; render(); break;
      case "unit-open": var uoC = el.getAttribute("data-c"), uoU = el.getAttribute("data-u"), uoUnit = unitOf(uoC, uoU);
        state.lv = { mode: uoUnit.kind === "dialogue" ? "dialogue" : "lesson", c: uoC, u: uoU, step: 0 }; $("#p-learn").scrollTop = 0; render(); break;
      case "unit-flat": state.lv = { mode: "unit", c: el.getAttribute("data-c"), u: el.getAttribute("data-u") }; $("#p-learn").scrollTop = 0; render(); break;
      case "lstep": var lsC = el.getAttribute("data-c"), lsU = el.getAttribute("data-u"), lsD = Number(el.getAttribute("data-d"));
        state.lv = { mode: "lesson", c: lsC, u: lsU, step: (state.lv.step || 0) + lsD }; $("#p-learn").scrollTop = 0; render(); break;
      case "locked-unit": toast("أكمل " + el.getAttribute("data-need") + " وحدات في الكورس الأول عشان يتفتح"); break;
      case "quiz": var qc = el.getAttribute("data-c"), u = COURSES[qc].units.filter(function (x) { return x.id === el.getAttribute("data-u"); })[0]; state.lv.c = qc; startQuiz(u.qs, u.title, qc + ":" + u.id); break;
      case "mrev": var mc = el.getAttribute("data-c"); state.lv.c = mc; startQuiz(mistakeIds(mc).map(function (id) { return QINDEX[id]; }), "مراجعة الأخطاء", null); break;
      case "pick": answerMcq(el.getAttribute("data-k")); break;
      case "submit": answerFill(); break;
      case "qnext": state.quiz.i++; state.quiz.ans = null; if (state.quiz.i >= state.quiz.qs.length) finishQuiz(); render(); break;
      case "cards": var cc = el.getAttribute("data-c"); state.lv.c = cc; state.card = { q: shuffle(dueCards(now, cc)).slice(0, 15), i: 0, flip: false, known: 0 }; state.lv = { mode: "cards", c: cc }; render(); break;
      case "flip": if (state.card) { state.card.flip = true; render(); } break;
      case "know": knowCard(el.getAttribute("data-v") === "1"); break;
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "ans") { e.preventDefault(); answerFill(); }
    if ((e.key === "Enter" || e.key === " ") && e.target && e.target.getAttribute && e.target.getAttribute("data-act") === "flip") { e.preventDefault(); if (state.card) { state.card.flip = true; render(); } }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "startdate" && t.value) { state.settings.startDate = t.value; saveMeta("settings"); render(); toast("تم تحديث بداية التتبع"); }
    if (t.id === "startpage") { var n = Math.max(1, Math.min(604, parseInt(t.value, 10) || 1)); state.settings.startPage = n; saveMeta("settings", 300); render(); }
  });

  function answerMcq(k) {
    var z = state.quiz, q = z.qs[z.i]; if (z.ans) return;
    var sel = q.o[Number(k)], ok = sel === q.a;
    z.ans = { sel: sel, ok: ok }; if (ok) { z.ok++; z.right.push(q.id); } else z.wrong.push(q.id);
    render();
  }
  function answerFill() {
    var z = state.quiz, q = z.qs[z.i], inp = $("#ans"); if (z.ans || !inp) return;
    var v = inp.value; if (!norm(v)) return;
    var ok = q.a.map(norm).indexOf(norm(v)) !== -1;
    z.ans = { sel: v, ok: ok }; if (ok) { z.ok++; z.right.push(q.id); } else z.wrong.push(q.id);
    render();
  }
  function knowCard(yes) {
    var c = state.card, w = c.q[c.i], now = nowR(), cur = state.learn.cards[w.id] || { box: 0 };
    if (yes) { cur.box = Math.min(3, cur.box + 1); cur.due = addDays(now.key, INTERVALS[cur.box]); c.known++; addXp(3, now); }
    else { cur.box = 0; cur.due = now.key; }
    state.learn.cards[w.id] = cur;
    c.i++; c.flip = false;
    saveMeta("learn", c.i >= c.q.length ? 0 : 1500);
    render();
  }

  /* ---------------- supabase + lock ---------------- */
  function snap() { return JSON.stringify([state.days, state.settings, state.tab === "learn" ? 0 : state.learn]); }
  function showLock(msg) {
    $("#lock").hidden = false; $("#lockmsg").textContent = msg || "";
    var pin = $("#pin"); pin.value = ""; setTimeout(function () { pin.focus(); }, 50);
  }
  function initSupa() {
    state.mode = "supa";
    store.sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false, autoRefreshToken: true, detectSessionInUrl: false } });
    showLock("");
  }
  async function unlock(code) {
    var btn = $("#pinbtn"); btn.disabled = true; $("#lockmsg").textContent = "";
    try {
      var r = await store.sb.auth.signInWithPassword({ email: CFG.email, password: CFG.prefix + code });
      if (r.error) {
        var m = r.error.message || "";
        $("#lockmsg").textContent = /invalid login/i.test(m) ? "الرمز غير صحيح" : "تعذّر الدخول: " + m;
        btn.disabled = false; return;
      }
      store.uid = r.data.user.id;
      $("#lock").hidden = true; $("#pin").value = "";
      await loadSupa(true);
      clearInterval(store.poll); store.poll = setInterval(function () { if (!document.hidden) loadSupa(false); }, 60000);
    } catch (e) { $("#lockmsg").textContent = "تعذّر الاتصال. تحقق من الإنترنت."; }
    btn.disabled = false;
  }
  async function loadSupa(first) {
    if (!store.uid) return;
    var before = snap();
    var d = await store.sb.from("masar_days").select("day,data");
    var m = await store.sb.from("masar_meta").select("name,data");
    if (d.error || m.error) {
      var err = (d.error || m.error).message || "";
      toast("تعذّر تحميل البيانات: " + err);
      if (first) { ready.days = ready.settings = ready.learn = true; checkLoaded(); render(); }
      return;
    }
    (d.data || []).forEach(function (r) { if (!dirty["day:" + r.day]) state.days[r.day] = r.data || {}; });
    var hasSettings = false;
    (m.data || []).forEach(function (r) {
      if (r.name === "settings") { hasSettings = true; if (!dirty["meta:settings"]) Object.assign(state.settings, r.data); }
      if (r.name === "learn" && !dirty["meta:learn"]) state.learn = Object.assign({ xp: 0, units: {}, cards: {}, mistakes: {}, study: {} }, r.data);
    });
    if (!hasSettings && first) { state.settings.startDate = nowR().key; saveMeta("settings"); }
    ready.days = ready.settings = ready.learn = true;
    var wasLoaded = state.loaded; checkLoaded();
    if (wasLoaded && snap() !== before) render();
  }
  async function lockNow() {
    clearInterval(store.poll);
    try { await store.sb.auth.signOut(); } catch (e) { }
    store.uid = null; state.days = {}; state.learn = { xp: 0, units: {}, cards: {}, mistakes: {}, study: {} };
    state.settings = { startDate: nowR().key, unit: "page", amount: 5, startPage: 1 };
    state.loaded = false; ready.days = ready.settings = ready.learn = false;
    state.quiz = null; state.card = null; state.lv = { mode: "courses" }; state.tab = "home"; state.pv = "today"; panelCache = {};
    $("#pager").scrollTo({ left: 0 }); render(); showLock("");
  }
  $("#lockform").addEventListener("submit", function (e) { e.preventDefault(); var v = $("#pin").value.trim(); if (v) unlock(v); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && state.mode === "supa" && store.uid) loadSupa(false); });

  /* ---------------- pager sync ---------------- */
  // Uses IntersectionObserver (not scrollLeft math) so it works regardless of how a
  // browser signs scrollLeft in an RTL container (this differs across engines and was
  // the root cause of the active tab not updating on a manual swipe).
  (function () {
    var pager = $("#pager");
    if (window.IntersectionObserver) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.intersectionRatio >= 0.55) {
            var t = en.target.id.replace("p-", "");
            if (t && t !== state.tab) { state.tab = t; markTabs(); }
          }
        });
      }, { root: pager, threshold: [0.55] });
      TABS.forEach(function (t) { var el = $("#p-" + t); if (el) io.observe(el); });
    } else {
      var tm;
      pager.addEventListener("scroll", function () {
        clearTimeout(tm);
        tm = setTimeout(function () {
          var max = pager.scrollWidth - pager.clientWidth;
          if (max <= 0) return;
          var frac = Math.abs(pager.scrollLeft) / max;
          var i = Math.round(frac * (TABS.length - 1)), t = TABS[i];
          if (t && t !== state.tab) { state.tab = t; markTabs(); }
        }, 90);
      }, { passive: true });
    }
  })();

  /* ---------------- boot ---------------- */
  applyTheme(getTheme());
  render();
  setInterval(tick, 1000);
  initStore();
})();
</script>
